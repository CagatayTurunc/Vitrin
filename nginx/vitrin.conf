server {
    listen 80;
    server_name vitrin.it.com www.vitrin.it.com;

    # Let's Encrypt dogrulama (certbot icin)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # HTTP -> HTTPS yonlendirmesi (SSL kurduktan sonra aktif edilecek)
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    # SSL kurulana kadar direkt proxy
    location / {
        proxy_pass         http://vitrin-web:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

