# Gecici HTTP config - SSL sertifikasi alinana kadar kullanilir
server {
    listen 80;
    server_name vitrin.it.com www.vitrin.it.com;

    # Let's Encrypt dogrulama
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # NextAuth'un kendi handle ettiği path'ler → Next.js
    location ~ ^/api/auth/(callback|signin|signout|session|csrf|providers|error|_log)(/|$) {
        proxy_pass         http://vitrin-web:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Diğer tüm /api/* istekleri → Gateway
    location /api/ {
        proxy_pass         http://vitrin-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Her şey → Next.js
    location / {
        proxy_pass         http://vitrin-web:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
