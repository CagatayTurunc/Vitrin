# HTTP → HTTPS yönlendirmesi
server {
    listen 80;
    server_name vitrin.it.com www.vitrin.it.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS ana sunucu
server {
    listen 443 ssl;
    server_name vitrin.it.com www.vitrin.it.com;

    ssl_certificate     /etc/letsencrypt/live/vitrin.it.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vitrin.it.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ──────────────────────────────────────────────────────────
    # Madde 9 — Güvenlik başlıkları
    # ──────────────────────────────────────────────────────────

    # HSTS (Madde 10): Tarayıcıya bu siteye her zaman HTTPS ile bağlanması söyleniyor.
    # max-age=31536000 = 1 yıl. İlk kez aktif ettikten 1 hafta sonra includeSubDomains eklenebilir.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Tarayıcının MIME type sniffing yapmasını engeller.
    # Saldırgan bir JS dosyasını image/png olarak gönderip çalıştırmaya çalışırsa engellenir.
    add_header X-Content-Type-Options "nosniff" always;

    # Sitrenin başka bir sitede iframe içinde açılmasını engeller (clickjacking koruması).
    add_header X-Frame-Options "DENY" always;

    # Eski XSS filter — modern tarayıcılarda artık kullanılmıyor ama zararı yok.
    add_header X-XSS-Protection "1; mode=block" always;

    # Referrer bilgisini dış sitelere gönderme.
    # Kullanıcı bir bağlantıya tıklayınca hangi sayfadan geldiğini gizler.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content Security Policy: Hangi kaynaklardan script/style/image yüklenebileceğini tanımlar.
    # Bu konfigürasyon Vitrin'e özel — Next.js inline style ve Cloudinary görselleri için açık.
    # 'unsafe-inline' kaldırılabilirse daha güvenli olur ama Next.js için şimdilik gerekli.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://res.cloudinary.com https://avatars.githubusercontent.com https://lh3.googleusercontent.com; font-src 'self'; connect-src 'self' https://api.cloudinary.com https://generativelanguage.googleapis.com; frame-ancestors 'none';" always;

    # Gereksiz tarayıcı özelliklerini kapatır (kamera, mikrofon vb.)
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ──────────────────────────────────────────────────────────

    # ──────────────────────────────────────────────────────────
    # /metrics endpoint'ini dışarıya kapat.
    # Prometheus scraping Docker iç ağından (vitrin-prometheus container'ından) yapılır.
    # Bu endpoint'e dışarıdan erişilirse DB sorgu sayıları, hata oranları,
    # iç servis latency'si gibi kritik sistem bilgileri ifşa olur.
    location /metrics {
        return 403;
    }

    # /health/detail sadece iç ağdan erişilebilir.
    # Dışarıdan erişilmeye çalışılırsa 403 döner.
    # /health (basit durum) hâlâ dışarıya açık — load balancer / uptime monitor için.
    location /health/detail {
        return 403;
    }

    # NextAuth'un kendi handle ettiği path'ler → Next.js
    # (callback, signin, signout, session, csrf, providers, error)
    location ~ ^/api/auth/(callback|signin|signout|session|csrf|providers|error|_log)(/|$) {
        proxy_pass         http://vitrin-web:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Diğer tüm /api/* istekleri (backend /api/auth/* dahil) → Gateway
    location /api/ {
        proxy_pass         http://vitrin-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Her şey → Next.js
    location / {
        proxy_pass         http://vitrin-web:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
