# ==============================================================
# Vitrin - Docker Compose Orkestrasyon
# KullanÄ±m: docker compose up -d --build
# ==============================================================

services:

  # ============================================================
  # OBSERVABILITY EXPORTERS
  # ============================================================

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: vitrin-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: "postgres:5432/postgres?sslmode=disable"
      DATA_SOURCE_USER: ${POSTGRES_USER:-postgres}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vitrin-network
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost:9187/metrics || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-exporter:
    image: oliver006/redis_exporter:v1.55.0
    container_name: vitrin-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: "redis:6379"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - vitrin-network
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost:9121/metrics || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    container_name: vitrin-kafka-exporter
    restart: unless-stopped
    command:
      - '--kafka.server=kafka:9092'
      - '--web.listen-address=:9308'
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - vitrin-network
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost:9308/metrics || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # OBSERVABILITY STACK
  # ============================================================

  jaeger:
    image: jaegertracing/all-in-one:1.53
    container_name: vitrin-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"   # Jaeger UI
      - "14268:14268"   # Jaeger HTTP collector
      - "14250:14250"   # Jaeger GRPC collector
    environment:
      COLLECTOR_OTLP_ENABLED: true
      COLLECTOR_ZIPKIN_HOST_PORT: 9411
    networks:
      - vitrin-network
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost:16686 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: vitrin-prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/vitrin-slo-rules.yml:/etc/prometheus/vitrin-slo-rules.yml:ro
      - ./vitrin-alerting-rules.yml:/etc/prometheus/vitrin-alerting-rules.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
    networks:
      - vitrin-network
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:10.3.1
    container_name: vitrin-grafana
    restart: unless-stopped
    ports:
      - "3004:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # Madde 21 â€” .env'i kapat: Hardcoded fallback ÅŸifresi kaldÄ±rÄ±ldÄ±.
      # GRAFANA_ADMIN_PASSWORD ortam deÄŸiÅŸkeni zorunlu â€” .env dosyasÄ±nda CHANGE_ME deÄŸeri ayarlanmalÄ±.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - vitrin-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: vitrin-elasticsearch
    restart: unless-stopped
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      discovery.type: single-node
      # GÃ¼venlik: xpack.security her zaman aÃ§Ä±k.
      # ELASTICSEARCH_PASSWORD env ile elastic kullanÄ±cÄ± ÅŸifresi set edilir.
      # Ä°lk kurulumda boÅŸ bÄ±rakÄ±labilir â€” sonra aÅŸaÄŸÄ±daki komutla ÅŸifre belirlenir:
      #   docker exec vitrin-elasticsearch \
      #     bin/elasticsearch-reset-password -u elastic -i
      # Serilog ve Kibana baÄŸlantÄ±larÄ± ELASTICSEARCH_PASSWORD'u kullanÄ±r.
      xpack.security.enabled: "true"
      xpack.security.enrollment.enabled: "false"
      # elastic kullanÄ±cÄ±sÄ± iÃ§in baÅŸlangÄ±Ã§ ÅŸifresi (boÅŸsa auth devre dÄ±ÅŸÄ± kalÄ±r)
      ELASTIC_PASSWORD: ${ELASTICSEARCH_PASSWORD:-}
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - vitrin-network
    healthcheck:
      # GÃ¼venlik aÃ§Ä±kken auth bilgisi gerekiyor â€” ÅŸifre yoksa anonymous health
      test: >
        sh -c "
          if [ -n \"$$ELASTICSEARCH_PASSWORD\" ]; then
            curl -sf -u elastic:$$ELASTICSEARCH_PASSWORD http://localhost:9200/_cluster/health
          else
            curl -sf http://localhost:9200/_cluster/health
          fi
        "
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: vitrin-kibana
    restart: unless-stopped
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_URL: http://elasticsearch:9200
      # Elasticsearch gÃ¼venlik aÃ§Ä±kken kullanÄ±cÄ± adÄ±/ÅŸifre gerekli
      ELASTICSEARCH_USERNAME: elastic
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD:-}
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - vitrin-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ============================================================
  # ALTYAPI SERVÄ°SLERÄ°
  # ============================================================

  # Madde 20 â€” Otomatik Yedek: pg_dump her gece 02:00'da Ã§alÄ±ÅŸÄ±r.
  # Yedekler /var/backups/vitrin-postgres iÃ§inde tutulur, 7 gÃ¼n sonra silinir.
  # S3_BUCKET env deÄŸiÅŸkeni tanÄ±mlanÄ±rsa otomatik olarak S3'e de yÃ¼kler.
  # Not: Sadece docker-compose.prod.yml'de aktif â€” dev'de ÅŸart deÄŸil.
  postgres-backup:
    image: postgres:16-alpine
    container_name: vitrin-postgres-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      BACKUP_RETENTION_DAYS: "7"
    volumes:
      - postgres_backup_data:/backups
    networks:
      - vitrin-network
    # Her gece 02:00 UTC'de tÃ¼m veritabanlarÄ±nÄ± yedekler
    entrypoint: >
      sh -c "
        echo 'Backup servisi baÅŸlatÄ±ldÄ±. Her gece 02:00 UTC Ã§alÄ±ÅŸÄ±r.';
        while true; do
          NOW=$$(date +%H:%M);
          if [ \"$$NOW\" = '02:00' ]; then
            TIMESTAMP=$$(date +%Y%m%d_%H%M%S);
            for DB in vitrin_auth vitrin_product vitrin_comment; do
              echo \"â†’ Yedekleniyor: $$DB\";
              pg_dump -h postgres -U $$POSTGRES_USER $$DB | gzip > /backups/$${DB}_$${TIMESTAMP}.sql.gz
                && echo \"  âœ… $$DB yedeklendi\" || echo \"  âŒ $$DB yedekleme baÅŸarÄ±sÄ±z!\";
            done;
            find /backups -name '*.sql.gz' -mtime +$${BACKUP_RETENTION_DAYS:-7} -delete;
            echo 'Eski yedekler temizlendi.';
          fi;
          sleep 60;
        done
      "

  postgres:
    image: postgres:16-alpine
    container_name: vitrin-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: vitrin_auth
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vitrin-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: vitrin-redis
    restart: unless-stopped
    # Redis ÅŸifre korumasÄ±: REDIS_PASSWORD env deÄŸiÅŸkeni tanÄ±mlanÄ±rsa aktif olur.
    # Dev ortamÄ±nda boÅŸ bÄ±rakÄ±labilir (Docker iÃ§ aÄŸÄ±yla izole).
    # Production'da .env dosyasÄ±na REDIS_PASSWORD=<gÃ¼Ã§lÃ¼-ÅŸifre> eklenmeli.
    command: >
      sh -c "
        if [ -n \"$$REDIS_PASSWORD\" ]; then
          redis-server --requirepass $$REDIS_PASSWORD
        else
          redis-server
        fi
      "
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    networks:
      - vitrin-network
    healthcheck:
      test: >
        sh -c "
          if [ -n \"$$REDIS_PASSWORD\" ]; then
            redis-cli -a $$REDIS_PASSWORD ping
          else
            redis-cli ping
          fi
        "
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: vitrin-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_4LW_COMMANDS_WHITELIST: "ruok,stat,srvr"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    networks:
      - vitrin-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: vitrin-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Docker iÃ§i servisler kafka:9092, local servisler localhost:29092 kullanÄ±r
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "29092:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - vitrin-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ============================================================
  # UYGULAMA SERVÄ°SLERÄ°
  # ============================================================

  vitrin-auth:
    build:
      context: .
      dockerfile: src/Services/Auth/Vitrin.Auth.Api/Dockerfile
    container_name: vitrin-auth
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=vitrin_auth;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      ConnectionStrings__Redis: "${REDIS_PASSWORD:+redis:6379,password=${REDIS_PASSWORD}}${REDIS_PASSWORD:-redis:6379}"
      ConnectionStrings__Kafka: "kafka:9092"
      ConnectionStrings__Elasticsearch: "${ELASTICSEARCH_PASSWORD:+http://elastic:${ELASTICSEARCH_PASSWORD}@elasticsearch:9200}${ELASTICSEARCH_PASSWORD:-http://elasticsearch:9200}"
      Jwt__Secret: ${JWT_SECRET:?JWT_SECRET is required}
      Jwt__Issuer: Vitrin
      Jwt__Audience: Vitrin
      OAuth__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Email__AppBaseUrl: ${EMAIL_APP_BASE_URL:-http://localhost:3001}
      Email__From: ${EMAIL_FROM:-Vitrin <onboarding@resend.dev>}
      Email__TokenSecret: ${EMAIL_TOKEN_SECRET:-}
      Email__Resend__ApiKey: ${RESEND_API_KEY:-}
      # İyzico Payment Gateway
      Iyzico__ApiKey: ${IYZICO_API_KEY:-}
      Iyzico__SecretKey: ${IYZICO_SECRET_KEY:-}
      Iyzico__BaseUrl: ${IYZICO_BASE_URL:-https://sandbox-api.iyzipay.com}
      Iyzico__WebhookSecret: ${IYZICO_WEBHOOK_SECRET:-}
      # Observability
      OpenTelemetry__ServiceName: "Vitrin.Auth"
      OpenTelemetry__ServiceVersion: "1.0.0"
      OpenTelemetry__JaegerEndpoint: "http://jaeger:14268/api/traces"
      OpenTelemetry__OtlpEndpoint: "${OPENTELEMETRY_OTLP_ENDPOINT:-}"
      Serilog__MinimumLevel: ${LOG_LEVEL:-Information}
    networks:
      - vitrin-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  vitrin-product:
    build:
      context: .
      dockerfile: src/Services/Product/Vitrin.Product.Api/Dockerfile
    container_name: vitrin-product
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=vitrin_product;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      ConnectionStrings__Redis: "${REDIS_PASSWORD:+redis:6379,password=${REDIS_PASSWORD}}${REDIS_PASSWORD:-redis:6379}"
      ConnectionStrings__Kafka: "kafka:9092"
      ConnectionStrings__Elasticsearch: "${ELASTICSEARCH_PASSWORD:+http://elastic:${ELASTICSEARCH_PASSWORD}@elasticsearch:9200}${ELASTICSEARCH_PASSWORD:-http://elasticsearch:9200}"
      Jwt__Secret: ${JWT_SECRET:?JWT_SECRET is required}
      OpenTelemetry__ServiceName: "Vitrin.Product"
      OpenTelemetry__ServiceVersion: "1.0.0"
      OpenTelemetry__OtlpEndpoint: "${OPENTELEMETRY_OTLP_ENDPOINT:-}"
      Serilog__MinimumLevel: ${LOG_LEVEL:-Information}
    # Madde 20 â€” Ä°zinleri azalt: Product servisi artÄ±k dÄ±ÅŸarÄ±ya expose edilmiyor.
    # Sadece Docker iÃ§ aÄŸÄ±ndan (vitrin-gateway Ã¼zerinden) eriÅŸilebilir.
    # Dev ortamÄ±nda test etmek iÃ§in geÃ§ici olarak "5177:8080" ekleyebilirsiniz.
    networks:
      - vitrin-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  vitrin-voting:
    build:
      context: .
      dockerfile: src/Services/Voting/Vitrin.Voting.Api/Dockerfile
    container_name: vitrin-voting
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      Jwt__Secret: ${JWT_SECRET:?JWT_SECRET is required}
      ConnectionStrings__DefaultConnection: "Data Source=/app/data/voting_db.sqlite"
      ConnectionStrings__Elasticsearch: "${ELASTICSEARCH_PASSWORD:+http://elastic:${ELASTICSEARCH_PASSWORD}@elasticsearch:9200}${ELASTICSEARCH_PASSWORD:-http://elasticsearch:9200}"
      OpenTelemetry__ServiceName: "Vitrin.Voting"
      OpenTelemetry__ServiceVersion: "1.0.0"
      OpenTelemetry__OtlpEndpoint: "${OPENTELEMETRY_OTLP_ENDPOINT:-}"
      Serilog__MinimumLevel: ${LOG_LEVEL:-Information}
    volumes:
      - ./data/voting:/app/data
    networks:
      - vitrin-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  vitrin-comment:
    build:
      context: .
      dockerfile: src/Services/Comment/Vitrin.Comment.Api/Dockerfile
    container_name: vitrin-comment
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=vitrin_comment;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      ConnectionStrings__Elasticsearch: "${ELASTICSEARCH_PASSWORD:+http://elastic:${ELASTICSEARCH_PASSWORD}@elasticsearch:9200}${ELASTICSEARCH_PASSWORD:-http://elasticsearch:9200}"
      Jwt__Secret: ${JWT_SECRET:?JWT_SECRET is required}
      OpenTelemetry__ServiceName: "Vitrin.Comment"
      OpenTelemetry__ServiceVersion: "1.0.0"
      OpenTelemetry__OtlpEndpoint: "${OPENTELEMETRY_OTLP_ENDPOINT:-}"
      Serilog__MinimumLevel: ${LOG_LEVEL:-Information}
    networks:
      - vitrin-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  vitrin-notification:
    build:
      context: .
      dockerfile: src/Services/Notification/Vitrin.Notification.Api/Dockerfile
    container_name: vitrin-notification
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      Jwt__Secret: ${JWT_SECRET:?JWT_SECRET is required}
      ConnectionStrings__DefaultConnection: "Data Source=/app/data/notification_db.sqlite"
      ConnectionStrings__Elasticsearch: "${ELASTICSEARCH_PASSWORD:+http://elastic:${ELASTICSEARCH_PASSWORD}@elasticsearch:9200}${ELASTICSEARCH_PASSWORD:-http://elasticsearch:9200}"
      Email__From: ${EMAIL_FROM:-Vitrin <onboarding@resend.dev>}
      Email__Resend__ApiKey: ${RESEND_API_KEY:-}
      OpenTelemetry__ServiceName: "Vitrin.Notification"
      OpenTelemetry__ServiceVersion: "1.0.0"
      OpenTelemetry__OtlpEndpoint: "${OPENTELEMETRY_OTLP_ENDPOINT:-}"
      Serilog__MinimumLevel: ${LOG_LEVEL:-Information}
    volumes:
      - ./data/notification:/app/data
    networks:
      - vitrin-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  vitrin-analytics:
    build:
      context: .
      dockerfile: src/Services/Analytics/Vitrin.Analytics.Api/Dockerfile
    container_name: vitrin-analytics
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      Jwt__Secret: ${JWT_SECRET:?JWT_SECRET is required}
      ConnectionStrings__DefaultConnection: "Data Source=/app/data/analytics_db.sqlite"
      ConnectionStrings__Elasticsearch: "${ELASTICSEARCH_PASSWORD:+http://elastic:${ELASTICSEARCH_PASSWORD}@elasticsearch:9200}${ELASTICSEARCH_PASSWORD:-http://elasticsearch:9200}"
      OpenTelemetry__ServiceName: "Vitrin.Analytics"
      OpenTelemetry__ServiceVersion: "1.0.0"
      OpenTelemetry__OtlpEndpoint: "${OPENTELEMETRY_OTLP_ENDPOINT:-}"
      Serilog__MinimumLevel: ${LOG_LEVEL:-Information}
    volumes:
      - ./data/analytics:/app/data
    networks:
      - vitrin-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  vitrin-ai:
    build:
      context: .
      dockerfile: src/Services/Ai/Vitrin.Ai.Api/Dockerfile
    container_name: vitrin-ai
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      Jwt__Secret: ${JWT_SECRET:?JWT_SECRET is required}
      ConnectionStrings__DefaultConnection: "Data Source=/app/data/ai_db.sqlite"
      ConnectionStrings__Elasticsearch: "${ELASTICSEARCH_PASSWORD:+http://elastic:${ELASTICSEARCH_PASSWORD}@elasticsearch:9200}${ELASTICSEARCH_PASSWORD:-http://elasticsearch:9200}"
      Gemini__ApiKey: ${GEMINI_API_KEY:-}
      AiQuota__DailyRequestLimit: ${AI_DAILY_REQUEST_LIMIT:-10}
      OpenTelemetry__ServiceName: "Vitrin.Ai"
      OpenTelemetry__ServiceVersion: "1.0.0"
      OpenTelemetry__OtlpEndpoint: "${OPENTELEMETRY_OTLP_ENDPOINT:-}"
      Serilog__MinimumLevel: ${LOG_LEVEL:-Information}
    volumes:
      - ./data/ai:/app/data
    networks:
      - vitrin-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================================
  # GATEWAY
  # ============================================================

  vitrin-gateway:
    build:
      context: .
      dockerfile: src/Gateways/Vitrin.Gateway/Dockerfile
    container_name: vitrin-gateway
    restart: unless-stopped
    ports:
      - "5000:8080"
    depends_on:
      vitrin-auth:
        condition: service_healthy
      vitrin-product:
        condition: service_healthy
      vitrin-voting:
        condition: service_healthy
      vitrin-comment:
        condition: service_healthy
      vitrin-notification:
        condition: service_healthy
      vitrin-analytics:
        condition: service_healthy
      vitrin-ai:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      Jwt__Secret: ${JWT_SECRET:?JWT_SECRET is required}
      Jwt__Issuer: Vitrin
      Jwt__Audience: Vitrin
      # REDIS_PASSWORD tanÄ±mlÄ±ysa ÅŸifreli baÄŸlantÄ± kullan
      ConnectionStrings__Redis: "${REDIS_PASSWORD:+redis:6379,password=${REDIS_PASSWORD}}${REDIS_PASSWORD:-redis:6379}"
    networks:
      - vitrin-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================================
  # FRONTEND
  # ============================================================

  vitrin-web:
    build:
      context: .
      dockerfile: src/Web/Vitrin.Web.UI/Dockerfile
      args:
        # BoÅŸ bÄ±rakÄ±lÄ±r â€” client fetch'leri relative /api/* path'i kullanÄ±r,
        # next.config.mjs rewrites bunlarÄ± INTERNAL_API_URL'ye yÃ¶nlendirir.
        NEXT_PUBLIC_API_URL: ""
        NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME:-}
        NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET: ${NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET:-}
    container_name: vitrin-web
    restart: unless-stopped
    ports:
      - "3003:3000"
    depends_on:
      vitrin-gateway:
        condition: service_healthy
    environment:
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3003}
      INTERNAL_API_URL: http://vitrin-gateway:8080
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    networks:
      - vitrin-network

# ============================================================
# AÄLAR
# ============================================================

networks:
  vitrin-network:
    driver: bridge

# ============================================================
# VOLUMELER
# ============================================================

volumes:
  postgres_data:
    name: vitrin_postgres_data
  postgres_backup_data:
    name: vitrin_postgres_backup_data
  redis_data:
    name: vitrin_redis_data
  kafka_data:
    name: vitrin_kafka_data
  zookeeper_data:
    name: vitrin_zookeeper_data
  # Observability volumes
  prometheus_data:
    name: vitrin_prometheus_data
  grafana_data:
    name: vitrin_grafana_data
  elasticsearch_data:
    name: vitrin_elasticsearch_data
