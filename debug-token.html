<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vitrin API Debug</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
    .card { background: white; border-radius: 8px; padding: 16px; margin: 12px 0; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
    textarea, input { width: 100%; box-sizing: border-box; padding: 8px; margin: 6px 0; border: 1px solid #ccc; border-radius: 4px; font-family: monospace; font-size: 13px; }
    textarea { min-height: 80px; }
    button { padding: 8px 18px; background: #007A52; color: white; border: none; border-radius: 4px; cursor: pointer; margin: 4px 4px 4px 0; font-size: 14px; }
    button.danger { background: #dc3545; }
    button.info   { background: #0d6efd; }
    pre { background: #1e1e1e; color: #d4d4d4; padding: 12px; border-radius: 6px; overflow-x: auto; white-space: pre-wrap; font-size: 12px; max-height: 400px; overflow-y: auto; }
    .ok   { color: #198754; font-weight: bold; }
    .fail { color: #dc3545; font-weight: bold; }
    label { font-weight: bold; font-size: 13px; }
    h2 { margin: 0 0 8px 0; font-size: 16px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  </style>
</head>
<body>
  <h1 style="font-size:22px">🔧 Vitrin API Debug</h1>

  <!-- TOKEN INPUT -->
  <div class="card">
    <h2>1. Token</h2>
    <label>API Base URL</label>
    <input id="apiUrl" value="https://vitrin.it.com" />
    <label>Access Token (Bearer)</label>
    <textarea id="token" placeholder="Tarayıcı DevTools > Application > Cookies > next-auth.session-token kısmından kopyala, veya buradaki 'Token Yükle' butonunu kullan"></textarea>
    <div class="row">
      <button onclick="loadFromCookie()">🍪 Cookie'den Token Yükle</button>
      <button class="info" onclick="decodeToken()">🔍 Token Decode Et</button>
    </div>
    <pre id="tokenInfo">Token girilmedi.</pre>
  </div>

  <!-- USERS/ME TEST -->
  <div class="card">
    <h2>2. GET /api/auth/users/me</h2>
    <button onclick="testUsersMe()">▶ Test Et</button>
    <pre id="usersMeResult">—</pre>
  </div>

  <!-- MAKER APPLICATION TEST -->
  <div class="card">
    <h2>3. POST /api/auth/maker-applications</h2>
    <label>portfolioUrl</label>
    <input id="portfolioUrl" value="https://github.com/test" />
    <label>reason (en az 30 karakter)</label>
    <textarea id="reason">Bu bir test başvurusudur, API endpoint testini gerçekleştirmek için gönderilmektedir.</textarea>
    <div class="row">
      <button onclick="testMakerApp()">▶ Başvuruyu Gönder</button>
    </div>
    <pre id="makerAppResult">—</pre>
  </div>

  <!-- RAW REQUEST -->
  <div class="card">
    <h2>4. Ham İstek Gönder</h2>
    <label>Method</label>
    <input id="rawMethod" value="GET" style="width:80px;display:inline" />
    <label style="margin-left:8px">Path</label>
    <input id="rawPath" value="/api/auth/users/me" style="width:calc(100% - 120px);display:inline" />
    <label>Body (opsiyonel, JSON)</label>
    <textarea id="rawBody" placeholder='{"key": "value"}'></textarea>
    <button onclick="sendRaw()">▶ Gönder</button>
    <pre id="rawResult">—</pre>
  </div>

  <script>
    function getToken() { return document.getElementById("token").value.trim(); }
    function getApiUrl() { return document.getElementById("apiUrl").value.trim().replace(/\/$/, ""); }

    function loadFromCookie() {
      // NextAuth session token cookie
      const cookies = document.cookie.split(";").map(c => c.trim());
      const sessionCookie = cookies.find(c => c.startsWith("next-auth.session-token=") || c.startsWith("__Secure-next-auth.session-token="));
      if (sessionCookie) {
        const val = sessionCookie.split("=").slice(1).join("=");
        document.getElementById("token").value = val;
        document.getElementById("tokenInfo").innerHTML = '<span class="ok">Cookie bulundu.</span> Decode etmek için butona bas.';
      } else {
        document.getElementById("tokenInfo").innerHTML = '<span class="fail">Cookie bulunamadı.</span> Token\'ı manuel yapıştır veya aynı domain\'de ol.';
      }
    }

    function decodeToken() {
      const token = getToken();
      if (!token) { document.getElementById("tokenInfo").innerText = "Token girilmedi."; return; }
      try {
        const parts = token.split(".");
        if (parts.length !== 3) throw new Error("JWT formatı değil (3 parça olmalı)");
        const payload = JSON.parse(atob(parts[1].replace(/-/g,"+").replace(/_/g,"/")));
        const now = Math.floor(Date.now() / 1000);
        const exp = payload.exp;
        const remaining = exp ? exp - now : null;
        const statusHtml = remaining === null
          ? '<span class="fail">exp claim yok</span>'
          : remaining > 0
            ? `<span class="ok">Geçerli (${Math.floor(remaining/60)} dakika kaldı)</span>`
            : `<span class="fail">SÜRESİ DOLMUŞ (${Math.floor(-remaining/60)} dakika önce)</span>`;
        document.getElementById("tokenInfo").innerHTML = statusHtml + "\n\n" + JSON.stringify(payload, null, 2);
      } catch(e) {
        document.getElementById("tokenInfo").innerHTML = `<span class="fail">Decode hatası: ${e.message}</span>`;
      }
    }

    async function request(method, path, body) {
      const token = getToken();
      const headers = { "Content-Type": "application/json" };
      if (token) headers["Authorization"] = `Bearer ${token}`;
      const opts = { method, headers };
      if (body) opts.body = JSON.stringify(body);
      const url = getApiUrl() + path;
      const start = Date.now();
      try {
        const res = await fetch(url, opts);
        const ms = Date.now() - start;
        const text = await res.text();
        let parsed;
        try { parsed = JSON.parse(text); } catch { parsed = text; }
        return { status: res.status, ok: res.ok, ms, body: parsed, headers: Object.fromEntries(res.headers) };
      } catch(e) {
        return { status: 0, ok: false, ms: Date.now()-start, body: e.message, error: true };
      }
    }

    function renderResult(elId, result) {
      const el = document.getElementById(elId);
      const statusHtml = result.ok
        ? `<span class="ok">✅ ${result.status}</span>`
        : `<span class="fail">❌ ${result.status}</span>`;
      el.innerHTML = `${statusHtml} (${result.ms}ms)\n\n${JSON.stringify(result.body, null, 2)}`;
    }

    async function testUsersMe() {
      document.getElementById("usersMeResult").innerText = "İstek gönderiliyor...";
      renderResult("usersMeResult", await request("GET", "/api/auth/users/me"));
    }

    async function testMakerApp() {
      document.getElementById("makerAppResult").innerText = "İstek gönderiliyor...";
      const body = {
        portfolioUrl: document.getElementById("portfolioUrl").value,
        reason: document.getElementById("reason").value
      };
      renderResult("makerAppResult", await request("POST", "/api/auth/maker-applications", body));
    }

    async function sendRaw() {
      document.getElementById("rawResult").innerText = "İstek gönderiliyor...";
      const method = document.getElementById("rawMethod").value.trim().toUpperCase();
      const path = document.getElementById("rawPath").value.trim();
      let body = null;
      const rawBody = document.getElementById("rawBody").value.trim();
      if (rawBody) {
        try { body = JSON.parse(rawBody); }
        catch { document.getElementById("rawResult").innerHTML = '<span class="fail">Body geçerli JSON değil</span>'; return; }
      }
      renderResult("rawResult", await request(method, path, body));
    }
  </script>
</body>
</html>
