global:
  smtp_smarthost: 'localhost:587'
  smtp_from: 'alerts@vitrin.com'

# Routing rules
route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'critical-alerts'
      repeat_interval: 5m
    - match:
        severity: warning  
      receiver: 'warning-alerts'
      repeat_interval: 30m

# Alert receivers
receivers:
  - name: 'default'
    slack_configs:
      - api_url: 'YOUR_SLACK_WEBHOOK_URL_HERE'
        channel: '#general'
        title: '🚨 Vitrin Alert'
        text: |
          Alert: {{ .GroupLabels.alertname }}
          Description: {{ range .Alerts }}{{ .Annotations.description }}{{ end }}
          
  - name: 'critical-alerts'
    slack_configs:
      - api_url: 'YOUR_SLACK_WEBHOOK_URL_HERE'
        channel: '#critical-alerts'
        title: '🔴 CRITICAL: {{ .GroupLabels.alertname }}'
        text: |
          🚨 **CRITICAL ALERT** 🚨
          
          **Alert:** {{ .GroupLabels.alertname }}
          **Service:** {{ .GroupLabels.service }}
          **Environment:** {{ .GroupLabels.environment }}
          
          **Description:**
          {{ range .Alerts }}{{ .Annotations.description }}{{ end }}
          
          **Action Required:** Immediate investigation needed!
        color: 'danger'
        
  - name: 'warning-alerts'
    slack_configs:
      - api_url: 'YOUR_SLACK_WEBHOOK_URL_HERE'
        channel: '#monitoring'
        title: '⚠️ WARNING: {{ .GroupLabels.alertname }}'
        text: |
          ⚠️ **Warning Alert** ⚠️
          
          **Alert:** {{ .GroupLabels.alertname }}
          **Service:** {{ .GroupLabels.service }}
          **Environment:** {{ .GroupLabels.environment }}
          
          **Description:**
          {{ range .Alerts }}{{ .Annotations.description }}{{ end }}
        color: 'warning'

# Inhibition rules (bir alert diğerini susturur)
inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'service']