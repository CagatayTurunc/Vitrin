name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  # ============================================================
  # 1. TEST
  # ============================================================
  test:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Vitrin.sln

      - name: Build
        run: dotnet build Vitrin.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test Vitrin.sln --no-build --configuration Release --verbosity minimal

  # ============================================================
  # 2. BUILD & PUSH IMAGES (GitHub Actions'da build edilir)
  # ============================================================
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - name: auth
            dockerfile: src/Services/Auth/Vitrin.Auth.Api/Dockerfile
          - name: product
            dockerfile: src/Services/Product/Vitrin.Product.Api/Dockerfile
          - name: voting
            dockerfile: src/Services/Voting/Vitrin.Voting.Api/Dockerfile
          - name: comment
            dockerfile: src/Services/Comment/Vitrin.Comment.Api/Dockerfile
          - name: notification
            dockerfile: src/Services/Notification/Vitrin.Notification.Api/Dockerfile
          - name: analytics
            dockerfile: src/Services/Analytics/Vitrin.Analytics.Api/Dockerfile
          - name: ai
            dockerfile: src/Services/Ai/Vitrin.Ai.Api/Dockerfile
          - name: gateway
            dockerfile: src/Gateways/Vitrin.Gateway/Dockerfile
          - name: web
            dockerfile: src/Web/Vitrin.Web.UI/Dockerfile
            context: src/Web/Vitrin.Web.UI
            build_args: "NEXT_PUBLIC_API_URL=https://vitrin.it.com\nINTERNAL_API_URL=http://vitrin-gateway:8080\nNEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=oiyajlxf\nNEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET=vitrin"
    steps:
      - uses: actions/checkout@v4

      - name: Owner kucuk harfe cevir
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: GHCR Login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host
            image=moby/buildkit:latest

      - name: Build & Push ${{ matrix.service.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context || '.' }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.name }}/vitrin-${{ matrix.service.name }}:latest
          build-args: ${{ matrix.service.build_args || '' }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}
          provenance: false

  # ============================================================
  # 3. DEPLOY (EC2 sadece pull & up yapar)
  # ============================================================
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 60s
          command_timeout: 300s
          script: |
            set -e
            echo "=== Başlangıç $(date) ==="

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin 2>/dev/null

            cd ~/vitrin

            echo "=== Pull latest images ==="
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull vitrin-auth vitrin-gateway vitrin-web

            echo "=== Stop & remove old app containers ==="
            docker stop vitrin-web vitrin-gateway vitrin-auth 2>/dev/null || true
            docker rm   vitrin-web vitrin-gateway vitrin-auth 2>/dev/null || true

            echo "=== Start vitrin-auth ==="
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-deps vitrin-auth
            echo "Waiting 20s for auth to initialize..."
            sleep 20

            echo "=== Start vitrin-gateway ==="
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-deps vitrin-gateway
            sleep 5

            echo "=== Start vitrin-web ==="
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-deps vitrin-web

            echo "=== Nginx reload ==="
            docker exec vitrin-nginx nginx -s reload 2>/dev/null || docker restart vitrin-nginx 2>/dev/null || true

            echo "=== Container status ==="
            docker ps --filter name=vitrin --format "table {{.Names}}\t{{.Status}}"

            echo "=== Bitti $(date) ==="
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # 4. SMOKE TEST (Deploy bittikten sonra production'ı test et)
  # ============================================================
  smoke-test:
    name: Smoke Tests (Production)
    runs-on: ubuntu-latest
    needs: deploy
    # Deploy başarılı olsa da olmasa da smoke testi çalıştır
    if: always() && needs.deploy.result != 'cancelled'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.13.0'

      - name: Install dependencies
        working-directory: src/Web/Vitrin.Web.UI
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: src/Web/Vitrin.Web.UI
        run: pnpm exec playwright install chromium --with-deps

      - name: Wait for deployment to stabilize
        run: |
          echo "Deployment tamamlanması bekleniyor (30s)..."
          sleep 30
          # Site erişilebilir mi?
          for i in {1..10}; do
            if curl -sf --max-time 10 "https://vitrin.it.com" -o /dev/null; then
              echo "Site erişilebilir ✅"
              break
            fi
            echo "Bekleniyor... ($i/10)"
            sleep 10
          done

      - name: Run smoke tests against production
        working-directory: src/Web/Vitrin.Web.UI
        env:
          PLAYWRIGHT_BASE_URL: https://vitrin.it.com
          GATEWAY_URL: https://vitrin.it.com
          # Opsiyonel — authenticated testler için
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: pnpm test:e2e:smoke
        # Smoke test başarısız olursa pipeline'ı durdur
        continue-on-error: false

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-report-${{ github.run_number }}
          path: artifacts/playwright-report/
          retention-days: 30

      - name: Upload failure screenshots & videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures-${{ github.run_number }}
          path: artifacts/playwright-results/
          retention-days: 14

      - name: Comment PR with test results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const status = '${{ job.status }}';
            const emoji = status === 'success' ? '✅' : '❌';
            const runUrl = `https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ${emoji} Smoke Test Sonucu: **${status.toUpperCase()}**\n\n[Playwright Raporunu Görüntüle](${runUrl})\n\n> Deploy sonrası otomatik smoke testler çalıştırıldı.`
            });
