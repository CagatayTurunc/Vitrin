name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  # ============================================================
  # 1. TEST
  # ============================================================
  test:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Vitrin.sln

      - name: Build
        run: dotnet build Vitrin.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test Vitrin.sln --no-build --configuration Release --verbosity minimal

  # ============================================================
  # 2. BUILD & PUSH IMAGES (GitHub Actions'da build edilir)
  # ============================================================
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - name: auth
            dockerfile: src/Services/Auth/Vitrin.Auth.Api/Dockerfile
          - name: product
            dockerfile: src/Services/Product/Vitrin.Product.Api/Dockerfile
          - name: voting
            dockerfile: src/Services/Voting/Vitrin.Voting.Api/Dockerfile
          - name: comment
            dockerfile: src/Services/Comment/Vitrin.Comment.Api/Dockerfile
          - name: notification
            dockerfile: src/Services/Notification/Vitrin.Notification.Api/Dockerfile
          - name: analytics
            dockerfile: src/Services/Analytics/Vitrin.Analytics.Api/Dockerfile
          - name: ai
            dockerfile: src/Services/Ai/Vitrin.Ai.Api/Dockerfile
          - name: gateway
            dockerfile: src/Gateways/Vitrin.Gateway/Dockerfile
          - name: web
            dockerfile: src/Web/Vitrin.Web.UI/Dockerfile
            context: src/Web/Vitrin.Web.UI
            build_args: "NEXT_PUBLIC_API_URL=https://vitrin.it.com\nINTERNAL_API_URL=http://vitrin-gateway:8080"
    steps:
      - uses: actions/checkout@v4

      - name: Owner kucuk harfe cevir
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: GHCR Login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host
            image=moby/buildkit:latest

      - name: Build & Push ${{ matrix.service.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context || '.' }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.name }}/vitrin-${{ matrix.service.name }}:latest
          build-args: ${{ matrix.service.build_args || '' }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}
          provenance: false

  # ============================================================
  # 3. DEPLOY (EC2 sadece pull & up yapar)
  # ============================================================
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 60s
          command_timeout: 300s
          script: |
            set -e
            echo "=== Başlangıç $(date) ==="

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin 2>/dev/null

            cd ~/vitrin

            echo "=== Pull latest images ==="
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull vitrin-auth vitrin-gateway vitrin-web

            echo "=== Remove orphan containers if any ==="
            docker stop vitrin-web vitrin-auth vitrin-gateway 2>/dev/null || true
            docker rm   vitrin-web vitrin-auth vitrin-gateway 2>/dev/null || true

            echo "=== Restart updated services (no-deps) ==="
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-deps vitrin-auth vitrin-gateway vitrin-web

            echo "=== Nginx reload ==="
            docker exec vitrin-nginx nginx -s reload 2>/dev/null || docker restart vitrin-nginx 2>/dev/null || true

            echo "=== Bitti $(date) ==="
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
