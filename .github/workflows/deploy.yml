name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  # ============================================================
  # 1. TEST
  # ============================================================
  test:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Vitrin.sln

      - name: Build
        run: dotnet build Vitrin.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test Vitrin.sln --no-build --configuration Release --verbosity minimal

  # ============================================================
  # 2. BUILD & PUSH IMAGES (GitHub Actions'da build edilir)
  # ============================================================
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - name: auth
            dockerfile: src/Services/Auth/Vitrin.Auth.Api/Dockerfile
          - name: product
            dockerfile: src/Services/Product/Vitrin.Product.Api/Dockerfile
          - name: voting
            dockerfile: src/Services/Voting/Vitrin.Voting.Api/Dockerfile
          - name: comment
            dockerfile: src/Services/Comment/Vitrin.Comment.Api/Dockerfile
          - name: notification
            dockerfile: src/Services/Notification/Vitrin.Notification.Api/Dockerfile
          - name: analytics
            dockerfile: src/Services/Analytics/Vitrin.Analytics.Api/Dockerfile
          - name: ai
            dockerfile: src/Services/Ai/Vitrin.Ai.Api/Dockerfile
          - name: gateway
            dockerfile: src/Gateways/Vitrin.Gateway/Dockerfile
          - name: web
            dockerfile: src/Web/Vitrin.Web.UI/Dockerfile
            context: src/Web/Vitrin.Web.UI
            build_args: "NEXT_PUBLIC_API_URL=https://vitrin.it.com"
    steps:
      - uses: actions/checkout@v4

      - name: Owner kucuk harfe cevir
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: GHCR Login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context || '.' }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.name }}/vitrin-${{ matrix.service.name }}:latest
          build-args: ${{ matrix.service.build_args || '' }}

  # ============================================================
  # 3. DEPLOY (EC2 sadece pull & up yapar)
  # ============================================================
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Konfigürasyon dosyalarini sunucuya kopyala
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml,docker-compose.prod.yml,scripts/init-databases.sql,nginx/"
          target: "/home/ec2-user/vitrin"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 300s
          command_timeout: 300s
          envs: ENV_FILE,CERTBOT_EMAIL
          script: |
            set -e
            cd /home/ec2-user/vitrin

            # GHCR login
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # .env dosyasini yaz
            printf '%s' "$ENV_FILE" > .env

            # NEXTAUTH_URL ve domain ayarla
            sed -i 's|NEXTAUTH_URL=http://localhost:3000|NEXTAUTH_URL=https://vitrin.it.com|g' .env
            sed -i 's|NEXTAUTH_URL=http://localhost:3001|NEXTAUTH_URL=https://vitrin.it.com|g' .env
            sed -i 's|NEXTAUTH_URL=http://localhost:3002|NEXTAUTH_URL=https://vitrin.it.com|g' .env
            sed -i 's|NEXTAUTH_URL=http://63.180.14.214:3002|NEXTAUTH_URL=https://vitrin.it.com|g' .env

            # docker-compose.yml'deki image'lari GHCR'dan kullan
            export OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

            # data klasorlerini olustur
            mkdir -p data/voting data/notification data/analytics data/ai
            mkdir -p nginx/ssl nginx/certbot

            # SSL sertifikasi var mi kontrol et
            SSL_EXISTS=$(docker volume inspect vitrin_certbot_ssl 2>/dev/null | grep -c '"Name"' || true)

            if [ "$SSL_EXISTS" -eq "0" ]; then
              echo "SSL sertifikasi bulunamadi, ilk kurulum basliyor..."

              # Once gecici HTTP config ile baslat (SSL olmadan nginx ayaga kalkar)
              cp nginx/vitrin-http.conf nginx/vitrin-active.conf
              # Gecici olarak http config kullan
              docker run -d --name vitrin-nginx-temp \
                -p 80:80 \
                -v $(pwd)/nginx/vitrin-http.conf:/etc/nginx/conf.d/default.conf:ro \
                -v vitrin_certbot_www:/var/www/certbot \
                --network vitrin-network \
                nginx:alpine || true

              sleep 5

              # Sertifika al
              docker run --rm \
                -v vitrin_certbot_ssl:/etc/letsencrypt \
                -v vitrin_certbot_www:/var/www/certbot \
                certbot/certbot certonly --webroot \
                --webroot-path=/var/www/certbot \
                -d vitrin.it.com -d www.vitrin.it.com \
                --email ${CERTBOT_EMAIL:-admin@vitrin.it.com} \
                --agree-tos --non-interactive --no-eff-email

              # Gecici nginx'i durdur
              docker stop vitrin-nginx-temp && docker rm vitrin-nginx-temp || true

              echo "SSL sertifikasi basariyla alindi!"
            else
              echo "SSL sertifikasi mevcut, yenileme kontrolu yapilacak."
            fi

            # Imajlari cek ve baslat
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans

            # Eski imajlari temizle
            docker image prune -f

            echo "Deploy tamamlandi!"
            docker compose -f docker-compose.yml -f docker-compose.prod.yml ps
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL }}
