name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  # ============================================================
  # 1. TEST
  # ============================================================
  test:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Vitrin.sln

      - name: Build
        run: dotnet build Vitrin.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test Vitrin.sln --no-build --configuration Release --verbosity minimal

  # ============================================================
  # 2. BUILD & PUSH IMAGES (GitHub Actions'da build edilir)
  # ============================================================
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - name: auth
            dockerfile: src/Services/Auth/Vitrin.Auth.Api/Dockerfile
          - name: product
            dockerfile: src/Services/Product/Vitrin.Product.Api/Dockerfile
          - name: voting
            dockerfile: src/Services/Voting/Vitrin.Voting.Api/Dockerfile
          - name: comment
            dockerfile: src/Services/Comment/Vitrin.Comment.Api/Dockerfile
          - name: notification
            dockerfile: src/Services/Notification/Vitrin.Notification.Api/Dockerfile
          - name: analytics
            dockerfile: src/Services/Analytics/Vitrin.Analytics.Api/Dockerfile
          - name: ai
            dockerfile: src/Services/Ai/Vitrin.Ai.Api/Dockerfile
          - name: gateway
            dockerfile: src/Gateways/Vitrin.Gateway/Dockerfile
          - name: web
            dockerfile: src/Web/Vitrin.Web.UI/Dockerfile
            context: src/Web/Vitrin.Web.UI
            build_args: "NEXT_PUBLIC_API_URL=https://vitrin.it.com\nINTERNAL_API_URL=http://vitrin-gateway:8080"
    steps:
      - uses: actions/checkout@v4

      - name: Owner kucuk harfe cevir
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: GHCR Login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context || '.' }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.name }}/vitrin-${{ matrix.service.name }}:latest
          build-args: ${{ matrix.service.build_args || '' }}

  # ============================================================
  # 3. DEPLOY (EC2 sadece pull & up yapar)
  # ============================================================
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 300s
          command_timeout: 300s
          envs: ENV_FILE,CERTBOT_EMAIL
          script: |
            set -e
            cd /home/ec2-user/vitrin

            # GHCR login
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # .env dosyasini yaz
            printf '%s' "$ENV_FILE" > .env
            
            # Production domain ayarlarini yap
            sed -i 's|NEXTAUTH_URL=.*|NEXTAUTH_URL=https://vitrin.it.com|g' .env
            sed -i 's|EMAIL_APP_BASE_URL=.*|EMAIL_APP_BASE_URL=https://vitrin.it.com|g' .env

            # data ve nginx klasorlerini olustur
            mkdir -p data/voting data/notification data/analytics data/ai

            # SSL sertifikasi daha once alinmis mi?
            if docker volume inspect vitrin_certbot_ssl > /dev/null 2>&1 && \
               docker run --rm -v vitrin_certbot_ssl:/etc/letsencrypt alpine \
               test -f /etc/letsencrypt/live/vitrin.it.com/fullchain.pem > /dev/null 2>&1; then
              SSL_EXISTS="1"
            else
              SSL_EXISTS="0"
            fi

            if [ "$SSL_EXISTS" -eq "0" ]; then
              echo ">>> SSL yok - HTTP moduyla baslayip sertifika alinacak"

              # HTTP config'i aktiflestir
              cp nginx/vitrin-http.conf nginx/vitrin.conf

              # Imajlari cek
              docker compose -f docker-compose.yml -f docker-compose.prod.yml pull

              # Servisleri HTTP moduyla baslat (network olusur, nginx ayaga kalkar)
              docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans

              echo ">>> Servisler baslatildi, kafka ve nginx ayaga kalkiyor (30 saniye)..."
              sleep 30

              # nginx saglik kontrolu
              docker ps | grep vitrin-nginx || (echo "HATA: nginx baslayamadi!" && exit 1)

              # Certbot ile sertifika al (nginx network'u uzerinden)
              echo ">>> Let's Encrypt sertifikasi aliniyor..."
              docker run --rm \
                --network vitrin-network \
                -v vitrin_certbot_ssl:/etc/letsencrypt \
                -v vitrin_certbot_www:/var/www/certbot \
                certbot/certbot certonly --webroot \
                --webroot-path=/var/www/certbot \
                -d vitrin.it.com -d www.vitrin.it.com \
                --email ${CERTBOT_EMAIL:-admin@vitrin.it.com} \
                --agree-tos --non-interactive --no-eff-email

              echo ">>> Sertifika alindi! HTTPS config'e geciliyor..."

              # HTTPS config'i aktiflestir ve nginx'i yeniden yukle
              cp nginx/vitrin-https.conf nginx/vitrin.conf
              docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T nginx nginx -s reload

              echo ">>> HTTPS aktif!"

            else
              echo ">>> SSL mevcut - normal deploy"

              # HTTPS config aktif mi kontrol et, degilse aktiflestir
              if grep -q "listen 443" nginx/vitrin.conf 2>/dev/null; then
                echo "HTTPS config zaten aktif."
              else
                cp nginx/vitrin-https.conf nginx/vitrin.conf
              fi

              # Imajlari cek ve guncelle
              docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
              docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans

            fi

            # Eski imajlari temizle
            docker image prune -f

            echo "=== Deploy tamamlandi! ==="
            docker compose -f docker-compose.yml -f docker-compose.prod.yml ps
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL }}
