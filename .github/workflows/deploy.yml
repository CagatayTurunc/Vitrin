name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Testleri atla (acil deploy için)'
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  # ============================================================
  # 0. DEPLOY GEREKLİ Mİ? Commit mesajında [deploy] yoksa
  #    sadece test çalışır, build+deploy atlanır.
  #    Örnek: git commit -m "fix: typo"         → sadece test
  #    Örnek: git commit -m "feat: yeni özellik [deploy]" → full deploy
  #    workflow_dispatch her zaman deploy yapar.
  # ============================================================
  check-deploy:
    name: Deploy Gerekli mi?
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
      changed_services: ${{ steps.changes.outputs.changed_services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Commit mesajını kontrol et
        id: check
        run: |
          MSG="${{ github.event.head_commit.message }}"
          if [[ "$MSG" == *"[deploy]"* ]] || [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "✅ Deploy tetiklenecek"
          else
            echo "should_deploy=false" >> $GITHUB_OUTPUT
            echo "⏭️ Sadece test çalışacak (commit'e [deploy] ekle)"
          fi

      - name: Hangi servisler değişti?
        id: changes
        run: |
          # [deploy:all] varsa hepsini build et
          MSG="${{ github.event.head_commit.message }}"
          if [[ "$MSG" == *"[deploy:all]"* ]]; then
            echo "changed_services=auth,product,voting,comment,notification,analytics,ai,gateway,web" >> $GITHUB_OUTPUT
            echo "🔄 Tüm servisler build edilecek"
            exit 0
          fi

          # Değişen dosyalara göre servis tespiti
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          SERVICES=""

          has_change() { echo "$CHANGED" | grep -q "^$1" && return 0 || return 1; }
          add_svc()    { SERVICES="${SERVICES:+$SERVICES,}$1"; }

          has_change "src/Services/Auth/"        && add_svc "auth"
          has_change "src/Services/Product/"     && add_svc "product"
          has_change "src/Services/Voting/"      && add_svc "voting"
          has_change "src/Services/Comment/"     && add_svc "comment"
          has_change "src/Services/Notification/" && add_svc "notification"
          has_change "src/Services/Analytics/"   && add_svc "analytics"
          has_change "src/Services/Ai/"          && add_svc "ai"
          has_change "src/Gateways/"             && add_svc "gateway"
          has_change "src/Web/"                  && add_svc "web"
          has_change "src/Shared/"               && SERVICES="auth,product,voting,comment,notification,analytics,ai,gateway"

          # Hiç servis değişmemişse (sadece config/docs) → hepsini build et
          if [ -z "$SERVICES" ]; then
            SERVICES="auth,product,voting,comment,notification,analytics,ai,gateway,web"
            echo "⚠️  Servis tespiti yapılamadı, tüm servisler build edilecek"
          fi

          echo "changed_services=$SERVICES" >> $GITHUB_OUTPUT
          echo "✅ Build edilecek servisler: $SERVICES"

  # ============================================================
  # 1. TEST
  # ============================================================
  test:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: check-deploy
    if: ${{ !inputs.skip_tests }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Vitrin.sln

      - name: Build
        run: dotnet build Vitrin.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test Vitrin.sln --no-build --configuration Release --verbosity minimal

  # ============================================================
  # 1b. GÜVENLİK TARAMASI
  # ============================================================
  security-scan:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: [check-deploy, test]
    if: always() && needs.check-deploy.outputs.should_deploy == 'true' && (needs.test.result == 'success' || needs.test.result == 'skipped')
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.13.0'

      - name: .NET vulnerability scan
        run: |
          dotnet restore Vitrin.sln
          dotnet list package --vulnerable --include-transitive 2>&1 | tee dotnet-vuln-report.txt
          if grep -i "Critical\|High" dotnet-vuln-report.txt; then
            echo "⚠️  Kritik veya yüksek güvenlik açığı bulundu!"
            exit 1
          fi
        continue-on-error: true

      - name: Frontend vulnerability scan (pnpm audit)
        working-directory: src/Web/Vitrin.Web.UI
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --audit-level=high 2>&1 | tee pnpm-audit-report.txt
        continue-on-error: true

      - name: Docker image vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
        continue-on-error: true

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-${{ github.run_number }}
          path: |
            dotnet-vuln-report.txt
            pnpm-audit-report.txt
          retention-days: 30

  # ============================================================
  # 2. BUILD & PUSH IMAGES
  # Image tag: her build'e özgü SHA + ayrıca 'latest' alias
  # Neden commit SHA? Rollback ve traceability için kritik.
  # ghcr.io/.../vitrin-auth:a1b2c3d → hangi commit, ne zaman, kim deploy etti
  # ============================================================
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [check-deploy, test, security-scan]
    if: always() && needs.check-deploy.outputs.should_deploy == 'true' && (needs.test.result == 'success' || needs.test.result == 'skipped') && needs.security-scan.result != 'failure'
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.short_sha }}
    strategy:
      matrix:
        service:
          - name: auth
            dockerfile: src/Services/Auth/Vitrin.Auth.Api/Dockerfile
          - name: product
            dockerfile: src/Services/Product/Vitrin.Product.Api/Dockerfile
          - name: voting
            dockerfile: src/Services/Voting/Vitrin.Voting.Api/Dockerfile
          - name: comment
            dockerfile: src/Services/Comment/Vitrin.Comment.Api/Dockerfile
          - name: notification
            dockerfile: src/Services/Notification/Vitrin.Notification.Api/Dockerfile
          - name: analytics
            dockerfile: src/Services/Analytics/Vitrin.Analytics.Api/Dockerfile
          - name: ai
            dockerfile: src/Services/Ai/Vitrin.Ai.Api/Dockerfile
          - name: gateway
            dockerfile: src/Gateways/Vitrin.Gateway/Dockerfile
          - name: web
            dockerfile: src/Web/Vitrin.Web.UI/Dockerfile
            context: src/Web/Vitrin.Web.UI
            build_args: |
              NEXT_PUBLIC_API_URL=https://vitrin.it.com
              INTERNAL_API_URL=http://vitrin-gateway:8080
              NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=oiyajlxf
              NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET=vitrin
    steps:
      - uses: actions/checkout@v4

      - name: Bu servis değişti mi?
        id: should_build
        run: |
          CHANGED="${{ needs.check-deploy.outputs.changed_services }}"
          SVC="${{ matrix.service.name }}"
          # Virgülle ayrılmış listeyi split edip tam eşleşme kontrolü yap
          # \b bash'te çalışmaz — IFS split ile güvenli kontrol
          FOUND=false
          IFS=',' read -ra LIST <<< "$CHANGED"
          for item in "${LIST[@]}"; do
            if [ "$item" = "$SVC" ]; then
              FOUND=true
              break
            fi
          done
          if [ "$FOUND" = "true" ]; then
            echo "build=true" >> $GITHUB_OUTPUT
            echo "✅ $SVC build edilecek"
          else
            echo "build=false" >> $GITHUB_OUTPUT
            echo "⏭️ $SVC atlanıyor (değişiklik yok)"
          fi

      - name: Image tag hesapla (commit SHA kısa)
        id: meta
        run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Owner küçük harfe çevir
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: GHCR Login
        if: steps.should_build.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        if: steps.should_build.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host
            image=moby/buildkit:latest

      - name: Build & Push ${{ matrix.service.name }}
        if: steps.should_build.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context || '.' }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/vitrin-${{ matrix.service.name }}:${{ steps.meta.outputs.short_sha }}
            ghcr.io/${{ steps.owner.outputs.name }}/vitrin-${{ matrix.service.name }}:latest
          build-args: ${{ matrix.service.build_args || '' }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}
          provenance: false

  # ============================================================
  # 2b. CONTAINER IMAGE SCAN + SBOM
  # Build sonrası kritik servislerin image'larını tara
  # SBOM (Software Bill of Materials) artifact olarak sakla
  # ============================================================
  image-scan:
    name: Container Image Scan & SBOM
    runs-on: ubuntu-latest
    needs: build
    if: always() && needs.build.result == 'success'
    permissions:
      contents: read
      packages: read
      security-events: write   # SARIF upload için

    steps:
      - uses: actions/checkout@v4

      - name: Owner küçük harfe çevir
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Commit SHA kısa
        id: meta
        run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: GHCR Login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Trivy: Gateway image'ı tara (en kritik — dışa açık tek endpoint) ──
      - name: Trivy scan — vitrin-gateway
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ steps.owner.outputs.name }}/vitrin-gateway:${{ steps.meta.outputs.short_sha }}
          format: 'sarif'
          output: 'trivy-gateway.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
        continue-on-error: true

      # ── Trivy: Auth image'ı tara (JWT + kullanıcı verisi) ──────────────────
      - name: Trivy scan — vitrin-auth
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ steps.owner.outputs.name }}/vitrin-auth:${{ steps.meta.outputs.short_sha }}
          format: 'table'
          severity: 'CRITICAL'
          exit-code: '0'
        continue-on-error: true

      # ── Trivy: Web image'ı tara ─────────────────────────────────────────────
      - name: Trivy scan — vitrin-web
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ steps.owner.outputs.name }}/vitrin-web:${{ steps.meta.outputs.short_sha }}
          format: 'table'
          severity: 'CRITICAL'
          exit-code: '0'
        continue-on-error: true

      # ── SARIF upload: GitHub Security tab'ında görünür ─────────────────────
      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-gateway.sarif
          category: trivy-container-gateway
        continue-on-error: true

      # ── Syft: SBOM üret (CycloneDX format) ─────────────────────────────────
      # SBOM = Software Bill of Materials
      # Hangi paket, hangi sürüm, hangi lisans — tek belgede
      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin v1.5.0

      - name: SBOM — vitrin-gateway
        run: |
          syft ghcr.io/${{ steps.owner.outputs.name }}/vitrin-gateway:${{ steps.meta.outputs.short_sha }} \
            -o cyclonedx-json=sbom-gateway.json \
            -o table
        continue-on-error: true

      - name: SBOM — vitrin-auth
        run: |
          syft ghcr.io/${{ steps.owner.outputs.name }}/vitrin-auth:${{ steps.meta.outputs.short_sha }} \
            -o cyclonedx-json=sbom-auth.json
        continue-on-error: true

      - name: SBOM — vitrin-web
        run: |
          syft ghcr.io/${{ steps.owner.outputs.name }}/vitrin-web:${{ steps.meta.outputs.short_sha }} \
            -o cyclonedx-json=sbom-web.json
        continue-on-error: true

      # ── Artifact olarak sakla ────────────────────────────────────────────────
      - name: Upload scan results & SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-security-${{ github.run_number }}
          path: |
            trivy-gateway.sarif
            sbom-gateway.json
            sbom-auth.json
            sbom-web.json
          retention-days: 90


  # Tüm 9 servisi günceller + her servis için health check yapar
  # Smoke test başarısız olursa otomatik rollback tetiklenir
  # ============================================================
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: [check-deploy, build, image-scan]
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 60s
          command_timeout: 600s
          script: |
            set -e
            CHANGED_SERVICES="${{ needs.check-deploy.outputs.changed_services }}"
            echo "=== Deploy başladı: $(date) | Commit: ${{ github.sha }} ==="
            echo "=== Build edilecek servisler: $CHANGED_SERVICES ==="

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin 2>/dev/null

            cd ~/vitrin

            # ── .env dosyasındaki eksik değerleri tamamla ──────────────────
            update_env() {
              local key=$1
              local value=$2
              if [ -z "$value" ]; then return; fi
              sed -i "/^${key}=/d" .env
              echo "${key}=${value}" >> .env
            }

            update_env "IYZICO_API_KEY"        "${{ secrets.IYZICO_API_KEY }}"
            update_env "IYZICO_SECRET_KEY"     "${{ secrets.IYZICO_SECRET_KEY }}"
            update_env "IYZICO_BASE_URL"       "${{ secrets.IYZICO_BASE_URL }}"
            update_env "IYZICO_WEBHOOK_SECRET" "${{ secrets.IYZICO_WEBHOOK_SECRET }}"
            update_env "APP_BASE_URL"          "https://vitrin.it.com"
            echo "✅ .env iyzico key'leri güncellendi"

            # ── Rollback için mevcut image tag'lerini kaydet ──────────────
            echo "=== Mevcut image tag'leri kaydediliyor (rollback için) ==="
            docker inspect vitrin-auth    --format='{{index .Config.Image}}' 2>/dev/null > /tmp/prev_auth_image    || echo "unknown" > /tmp/prev_auth_image
            docker inspect vitrin-web     --format='{{index .Config.Image}}' 2>/dev/null > /tmp/prev_web_image     || echo "unknown" > /tmp/prev_web_image
            docker inspect vitrin-gateway --format='{{index .Config.Image}}' 2>/dev/null > /tmp/prev_gateway_image || echo "unknown" > /tmp/prev_gateway_image

            # ── Yardımcı fonksiyonlar ────────────────────────────────────
            # Bir servis changed_services listesinde var mı?
            should_deploy_service() {
              local svc=$1
              local found=false
              IFS=',' read -ra LIST <<< "$CHANGED_SERVICES"
              for item in "${LIST[@]}"; do
                [ "$item" = "$svc" ] && found=true && break
              done
              [ "$found" = "true" ]
            }

            # Image pull (sadece değişen servis)
            pull_if_changed() {
              local svc=$1
              local compose_name=$2
              if should_deploy_service "$svc"; then
                echo "--- Pull: vitrin-$svc ---"
                docker compose -f docker-compose.yml -f docker-compose.prod.yml pull "$compose_name"
                sleep 2
              else
                echo "⏭️  vitrin-$svc pull atlanıyor (değişiklik yok)"
              fi
            }

            # Health check
            health_check_container() {
              local container=$1
              local retries=${2:-12}
              for i in $(seq 1 $retries); do
                if docker exec "$container" curl -sf --max-time 5 http://localhost:8080/health -o /dev/null 2>/dev/null; then
                  echo "✅ $container sağlıklı ($i. deneme)"
                  return 0
                fi
                echo "⏳ $container bekleniyor... ($i/$retries)"
                sleep 5
              done
              echo "❌ $container health check başarısız"
              return 1
            }

            # Restart + health check (sadece değişen servis)
            restart_if_changed() {
              local svc=$1          # changed_services'taki isim (auth, web …)
              local compose_name=$2 # docker-compose service adı
              local container=$3    # container adı (health check için)
              if should_deploy_service "$svc"; then
                echo "--- $compose_name yeniden başlatılıyor ---"
                docker compose -f docker-compose.yml -f docker-compose.prod.yml \
                  up -d --no-deps --force-recreate "$compose_name"
                sleep 3
                health_check_container "$container"
              else
                echo "⏭️  $compose_name atlanıyor (değişiklik yok)"
              fi
            }

            # ── Image pull: sadece değişen servisler ─────────────────────
            echo "=== Image pull (sadece değişen servisler) ==="
            pull_if_changed "auth"         "vitrin-auth"
            pull_if_changed "product"      "vitrin-product"
            pull_if_changed "voting"       "vitrin-voting"
            pull_if_changed "comment"      "vitrin-comment"
            pull_if_changed "notification" "vitrin-notification"
            pull_if_changed "analytics"    "vitrin-analytics"
            pull_if_changed "ai"           "vitrin-ai"
            pull_if_changed "gateway"      "vitrin-gateway"
            pull_if_changed "web"          "vitrin-web"

            # ── Servis bazlı rolling restart ──────────────────────────────
            echo "=== Servisler yeniden başlatılıyor (sadece değişenler) ==="
            restart_if_changed "auth"         "vitrin-auth"         "vitrin-auth"
            restart_if_changed "product"      "vitrin-product"      "vitrin-product"
            restart_if_changed "voting"       "vitrin-voting"       "vitrin-voting"
            restart_if_changed "comment"      "vitrin-comment"      "vitrin-comment"
            restart_if_changed "notification" "vitrin-notification" "vitrin-notification"
            restart_if_changed "analytics"    "vitrin-analytics"    "vitrin-analytics"
            restart_if_changed "ai"           "vitrin-ai"           "vitrin-ai"
            restart_if_changed "gateway"      "vitrin-gateway"      "vitrin-gateway"

            # Web servisi Next.js — farklı port ve daha uzun başlangıç süresi
            if should_deploy_service "web"; then
              echo "--- vitrin-web yeniden başlatılıyor ---"
              docker compose -f docker-compose.yml -f docker-compose.prod.yml \
                up -d --no-deps --force-recreate vitrin-web
              sleep 8
              WEB_HEALTHY=false
              for i in {1..30}; do
                # Önce container çalışıyor mu?
                CONTAINER_STATUS=$(docker inspect vitrin-web --format='{{.State.Status}}' 2>/dev/null || echo "unknown")
                if [ "$CONTAINER_STATUS" = "exited" ] || [ "$CONTAINER_STATUS" = "dead" ]; then
                  echo "❌ Container durdu (status: $CONTAINER_STATUS)"
                  break
                fi
                # Production'da port dışarıya açık değil (nginx üzerinden erişiliyor)
                # Container içinden docker exec ile health check yap
                if docker exec vitrin-web node -e "
                  const http = require('http');
                  const req = http.get('http://localhost:3000/api/health', (res) => {
                    process.exit(res.statusCode === 200 ? 0 : 1);
                  });
                  req.on('error', () => process.exit(1));
                  req.setTimeout(4000, () => { req.destroy(); process.exit(1); });
                " 2>/dev/null; then
                  echo "✅ vitrin-web sağlıklı ($i. deneme)"
                  WEB_HEALTHY=true
                  break
                fi
                echo "⏳ vitrin-web bekleniyor... ($i/30)"
                sleep 5
              done
              if [ "$WEB_HEALTHY" = "false" ]; then
                echo "❌ vitrin-web health check başarısız — deploy durduruluyor"
                echo "=== Son 100 satır container log ==="
                docker logs vitrin-web --tail 100 || true
                echo "=== Container inspect ==="
                docker inspect vitrin-web --format='Status: {{.State.Status}} | ExitCode: {{.State.ExitCode}} | Error: {{.State.Error}}' || true
                exit 1
              fi
            else
              echo "⏭️  vitrin-web atlanıyor (değişiklik yok)"
            fi

            echo "=== Nginx reload ==="
            docker exec vitrin-nginx nginx -s reload 2>/dev/null || docker restart vitrin-nginx 2>/dev/null || true

            echo "=== Tüm container durumları ==="
            docker ps --filter name=vitrin --format "table {{.Names}}\t{{.Status}}\t{{.Image}}"

            echo "=== Deploy tamamlandı: $(date) | Commit: ${{ github.sha }} ==="
            echo "=== Güncellenen servisler: $CHANGED_SERVICES ==="
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # 4. SMOKE TEST
  # ============================================================
  smoke-test:
    name: Smoke Tests (Production)
    runs-on: ubuntu-latest
    needs: deploy
    if: always() && needs.deploy.result != 'cancelled'

    steps:
      - uses: actions/checkout@v4

      # ============================================================
      # Madde 18: Secret Validation
      # Smoke test'ler çalışmadan önce tüm gerekli secret'ların
      # tanımlı olduğunu doğrula. Eksik secret deploy sonrası
      # test başarısızlığına neden olur.
      # ============================================================
      - name: Validate required secrets
        run: |
          echo "→ Gerekli secret'lar kontrol ediliyor..."
          
          # E2E test için gerekli secret'lar - eksikse uyarı ver ama devam et
          if [ -z "${{ secrets.E2E_TEST_EMAIL }}" ]; then
            echo "⚠️  UYARI: E2E_TEST_EMAIL tanımlı değil - E2E testleri atlanacak"
          fi
          
          if [ -z "${{ secrets.E2E_TEST_PASSWORD }}" ]; then
            echo "⚠️  UYARI: E2E_TEST_PASSWORD tanımlı değil - E2E testleri atlanacak"
          fi
          
          # Deploy için gerekli secret'lar
          if [ -z "${{ secrets.EC2_HOST }}" ]; then
            echo "⚠️  UYARI: EC2_HOST tanımlı değil"
          fi
          
          if [ -z "${{ secrets.EC2_USER }}" ]; then
            echo "⚠️  UYARI: EC2_USER tanımlı değil"
          fi
          
          if [ -z "${{ secrets.EC2_SSH_KEY }}" ]; then
            echo "⚠️  UYARI: EC2_SSH_KEY tanımlı değil"
          fi
          
          echo "✅ Secret kontrolü tamamlandı"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.13.0'

      - name: Install dependencies
        working-directory: src/Web/Vitrin.Web.UI
        run: pnpm install --no-frozen-lockfile
        continue-on-error: true

      - name: Install Playwright browsers
        working-directory: src/Web/Vitrin.Web.UI
        run: npx playwright install chromium --with-deps

      - name: Wait for deployment to stabilize
        run: |
          echo "Deployment stabilize olması bekleniyor (60s)..."
          sleep 60
          for i in {1..20}; do
            if curl -sf --max-time 15 "https://vitrin.it.com" -o /dev/null; then
              echo "Site erişilebilir ✅ ($i. deneme)"
              break
            fi
            echo "Bekleniyor... ($i/20)"
            sleep 15
          done
          echo "Son durum kontrol:"
          curl -sv --max-time 15 "https://vitrin.it.com" -o /dev/null 2>&1 | head -20 || true

      - name: Run smoke tests against production
        working-directory: src/Web/Vitrin.Web.UI
        env:
          PLAYWRIGHT_BASE_URL: https://vitrin.it.com
          GATEWAY_URL: https://vitrin.it.com
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: pnpm test:e2e:smoke
        continue-on-error: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-report-${{ github.run_number }}
          path: artifacts/playwright-report/
          retention-days: 30

      - name: Upload failure screenshots & videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures-${{ github.run_number }}
          path: artifacts/playwright-results/
          retention-days: 14

      - name: Comment PR with test results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}';
            const emoji = status === 'success' ? '✅' : '❌';
            const runUrl = `https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ${emoji} Smoke Test Sonucu: **${status.toUpperCase()}**\n\n[Playwright Raporunu Görüntüle](${runUrl})\n\n> Deploy sonrası otomatik smoke testler çalıştırıldı.`
            });

  # ============================================================
  # 5. OTOMATİK ROLLBACK
  # Smoke test başarısız olursa bir önceki başarılı commit'e döner
  # Nasıl çalışır: EC2'da önceki image tag'lerini yeniden deploy eder
  # ============================================================
  rollback:
    name: Auto Rollback
    runs-on: ubuntu-latest
    needs: smoke-test
    # Sadece smoke test başarısız olursa ve deploy başarılıysa çalışır
    if: failure() && needs.smoke-test.result == 'failure'

    steps:
      - name: Rollback via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 60s
          command_timeout: 300s
          script: |
            echo "🔴 Smoke test başarısız — rollback başlatılıyor..."
            cd ~/vitrin

            # Deploy adımında kaydedilen önceki image'lara geri dön
            PREV_AUTH=$(cat /tmp/prev_auth_image 2>/dev/null || echo "")
            PREV_WEB=$(cat /tmp/prev_web_image 2>/dev/null || echo "")
            PREV_GATEWAY=$(cat /tmp/prev_gateway_image 2>/dev/null || echo "")

            if [ -n "$PREV_AUTH" ] && [ "$PREV_AUTH" != "unknown" ]; then
              echo "Auth rollback: $PREV_AUTH"
              docker pull "$PREV_AUTH" || true
              docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-deps vitrin-auth
            fi

            if [ -n "$PREV_GATEWAY" ] && [ "$PREV_GATEWAY" != "unknown" ]; then
              echo "Gateway rollback: $PREV_GATEWAY"
              docker pull "$PREV_GATEWAY" || true
              docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-deps vitrin-gateway
            fi

            if [ -n "$PREV_WEB" ] && [ "$PREV_WEB" != "unknown" ]; then
              echo "Web rollback: $PREV_WEB"
              docker pull "$PREV_WEB" || true
              docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-deps vitrin-web
            fi

            docker exec vitrin-nginx nginx -s reload 2>/dev/null || true

            echo "✅ Rollback tamamlandı: $(date)"
            docker ps --filter name=vitrin --format "table {{.Names}}\t{{.Status}}\t{{.Image}}"

      - name: Rollback bildirimini GitHub'a yaz
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'failure',
              description: '🔴 Deploy başarısız — otomatik rollback uygulandı',
              context: 'ci/cd/deploy'
            });


