name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ============================================================
  # 1. TEST
  # ============================================================
  test:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Vitrin.sln

      - name: Build
        run: dotnet build Vitrin.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test Vitrin.sln --no-build --configuration Release --verbosity minimal

  # ============================================================
  # 2. DEPLOY
  # ============================================================
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Kodu sunucuya kopyala (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "."
          target: "/home/ec2-user/vitrin"
          rm: false

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 600s
          envs: ENV_FILE
          script: |
            set -e
            cd /home/ec2-user/vitrin

            # .env dosyasini environment variable'dan yaz (ozel karakter sorunu yok)
            printf '%s' "$ENV_FILE" > .env

            # NEXTAUTH_URL'yi sunucu IP'sine guncelle
            sed -i 's|NEXTAUTH_URL=http://localhost:3000|NEXTAUTH_URL=http://63.180.14.214:3002|g' .env
            sed -i 's|NEXTAUTH_URL=http://localhost:3001|NEXTAUTH_URL=http://63.180.14.214:3002|g' .env
            sed -i 's|NEXTAUTH_URL=http://localhost:3002|NEXTAUTH_URL=http://63.180.14.214:3002|g' .env

            # data klasorlerini olustur
            mkdir -p data/voting data/notification data/analytics data/ai

            # Imajlari build et ve baslat
            docker compose build
            docker compose up -d --remove-orphans

            # Eski imajlari temizle
            docker image prune -f

            echo "Deploy tamamlandi!"
            docker compose ps
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
