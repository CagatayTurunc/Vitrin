name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Testleri atla (acil deploy için)'
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  # ============================================================
  # 0. DEPLOY GEREKLİ Mİ? Commit mesajında [deploy] yoksa
  #    sadece test çalışır, build+deploy atlanır.
  #    Örnek: git commit -m "fix: typo"         → sadece test
  #    Örnek: git commit -m "feat: yeni özellik [deploy]" → full deploy
  #    workflow_dispatch her zaman deploy yapar.
  # ============================================================
  check-deploy:
    name: Deploy Gerekli mi?
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      - name: Commit mesajını kontrol et
        id: check
        run: |
          MSG="${{ github.event.head_commit.message }}"
          if [[ "$MSG" == *"[deploy]"* ]] || [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "✅ Deploy tetiklenecek"
          else
            echo "should_deploy=false" >> $GITHUB_OUTPUT
            echo "⏭️ Sadece test çalışacak (commit'e [deploy] ekle)"
          fi

jobs:
  # ============================================================
  # 1. TEST
  # ============================================================
  test:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: check-deploy
    if: ${{ !inputs.skip_tests }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Vitrin.sln

      - name: Build
        run: dotnet build Vitrin.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test Vitrin.sln --no-build --configuration Release --verbosity minimal

  # ============================================================
  # 1b. GÜVENLİK TARAMASI
  # ============================================================
  security-scan:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: [check-deploy, test]
    if: always() && needs.check-deploy.outputs.should_deploy == 'true' && (needs.test.result == 'success' || needs.test.result == 'skipped')
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.13.0'

      - name: .NET vulnerability scan
        run: |
          dotnet restore Vitrin.sln
          dotnet list package --vulnerable --include-transitive 2>&1 | tee dotnet-vuln-report.txt
          if grep -i "Critical\|High" dotnet-vuln-report.txt; then
            echo "⚠️  Kritik veya yüksek güvenlik açığı bulundu!"
            exit 1
          fi
        continue-on-error: true

      - name: Frontend vulnerability scan (pnpm audit)
        working-directory: src/Web/Vitrin.Web.UI
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --audit-level=high 2>&1 | tee pnpm-audit-report.txt
        continue-on-error: true

      - name: Docker image vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
        continue-on-error: true

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-${{ github.run_number }}
          path: |
            dotnet-vuln-report.txt
            pnpm-audit-report.txt
          retention-days: 30

  # ============================================================
  # 2. BUILD & PUSH IMAGES
  # Image tag: her build'e özgü SHA + ayrıca 'latest' alias
  # Neden commit SHA? Rollback ve traceability için kritik.
  # ghcr.io/.../vitrin-auth:a1b2c3d → hangi commit, ne zaman, kim deploy etti
  # ============================================================
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [check-deploy, test, security-scan]
    if: always() && needs.check-deploy.outputs.should_deploy == 'true' && (needs.test.result == 'success' || needs.test.result == 'skipped') && needs.security-scan.result != 'failure'
    permissions:
      contents: read
      packages: write
    outputs:
      # Deploy job'unda hangi tag'i pull edeceğimizi bilmek için
      image_tag: ${{ steps.meta.outputs.short_sha }}
    strategy:
      matrix:
        service:
          - name: auth
            dockerfile: src/Services/Auth/Vitrin.Auth.Api/Dockerfile
          - name: product
            dockerfile: src/Services/Product/Vitrin.Product.Api/Dockerfile
          - name: voting
            dockerfile: src/Services/Voting/Vitrin.Voting.Api/Dockerfile
          - name: comment
            dockerfile: src/Services/Comment/Vitrin.Comment.Api/Dockerfile
          - name: notification
            dockerfile: src/Services/Notification/Vitrin.Notification.Api/Dockerfile
          - name: analytics
            dockerfile: src/Services/Analytics/Vitrin.Analytics.Api/Dockerfile
          - name: ai
            dockerfile: src/Services/Ai/Vitrin.Ai.Api/Dockerfile
          - name: gateway
            dockerfile: src/Gateways/Vitrin.Gateway/Dockerfile
          - name: web
            dockerfile: src/Web/Vitrin.Web.UI/Dockerfile
            context: src/Web/Vitrin.Web.UI
            build_args: "NEXT_PUBLIC_API_URL=https://vitrin.it.com\nINTERNAL_API_URL=http://vitrin-gateway:8080\nNEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=oiyajlxf\nNEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET=vitrin"
    steps:
      - uses: actions/checkout@v4

      - name: Image tag hesapla (commit SHA kısa)
        id: meta
        run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Owner küçük harfe çevir
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: GHCR Login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host
            image=moby/buildkit:latest

      # Her image iki tag ile push edilir:
      # 1. ghcr.io/.../vitrin-auth:a1b2c3d  → rollback/traceability için
      # 2. ghcr.io/.../vitrin-auth:latest    → docker-compose.prod.yml uyumluluğu için
      - name: Build & Push ${{ matrix.service.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context || '.' }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/vitrin-${{ matrix.service.name }}:${{ steps.meta.outputs.short_sha }}
            ghcr.io/${{ steps.owner.outputs.name }}/vitrin-${{ matrix.service.name }}:latest
          build-args: ${{ matrix.service.build_args || '' }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}
          provenance: false

  # ============================================================
  # 3. DEPLOY
  # Tüm 9 servisi günceller + her servis için health check yapar
  # Smoke test başarısız olursa otomatik rollback tetiklenir
  # ============================================================
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 60s
          command_timeout: 600s
          script: |
            set -e
            echo "=== Deploy başladı: $(date) | Commit: ${{ github.sha }} ==="

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin 2>/dev/null

            cd ~/vitrin

            # Rollback için mevcut image tag'lerini kaydet
            echo "=== Mevcut image tag'leri kaydediliyor (rollback için) ==="
            docker inspect vitrin-auth  --format='{{index .Config.Image}}' 2>/dev/null > /tmp/prev_auth_image  || echo "unknown" > /tmp/prev_auth_image
            docker inspect vitrin-web   --format='{{index .Config.Image}}' 2>/dev/null > /tmp/prev_web_image   || echo "unknown" > /tmp/prev_web_image
            docker inspect vitrin-gateway --format='{{index .Config.Image}}' 2>/dev/null > /tmp/prev_gateway_image || echo "unknown" > /tmp/prev_gateway_image

            # Tüm uygulama servislerini pull et (altyapı servisleri hariç: db, redis, kafka vb.)
            echo "=== Tüm servis image'ları pull ediliyor ==="
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull \
              vitrin-auth \
              vitrin-product \
              vitrin-voting \
              vitrin-comment \
              vitrin-notification \
              vitrin-analytics \
              vitrin-ai \
              vitrin-gateway \
              vitrin-web

            # ── Servis bazlı rolling restart ──────────────────────────────
            # Sıra önemli: önce backend, sonra gateway, en son web
            # Her adımda health check — başarısız olursa deploy durur

            # Tüm backend servisler container içinde :8080/health endpoint'ini kullanır.
            # Dışa port expose edilmez — Docker exec üzerinden container içinden çağrılır.
            health_check_container() {
              local container=$1
              local retries=${2:-12}

              for i in $(seq 1 $retries); do
                if docker exec "$container" curl -sf --max-time 5 http://localhost:8080/health -o /dev/null 2>/dev/null; then
                  echo "✅ $container sağlıklı ($i. deneme)"
                  return 0
                fi
                echo "⏳ $container bekleniyor... ($i/$retries)"
                sleep 5
              done
              echo "❌ $container health check başarısız — deploy durduruluyor"
              return 1
            }

            restart_and_check() {
              local service=$1
              local container=$2

              echo "--- $service yeniden başlatılıyor ---"
              docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-deps "$service"
              health_check_container "$container"
            }

            restart_and_check vitrin-auth         vitrin-auth
            restart_and_check vitrin-product      vitrin-product
            restart_and_check vitrin-voting       vitrin-voting
            restart_and_check vitrin-comment      vitrin-comment
            restart_and_check vitrin-notification vitrin-notification
            restart_and_check vitrin-analytics    vitrin-analytics
            restart_and_check vitrin-ai           vitrin-ai
            restart_and_check vitrin-gateway      vitrin-gateway

            # Web servisi Next.js, farklı port
            echo "--- vitrin-web yeniden başlatılıyor ---"
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-deps vitrin-web
            for i in {1..12}; do
              if docker exec vitrin-web curl -sf --max-time 5 http://localhost:3000/api/health -o /dev/null 2>/dev/null; then
                echo "✅ vitrin-web sağlıklı ($i. deneme)"
                break
              fi
              echo "⏳ vitrin-web bekleniyor... ($i/12)"
              sleep 5
            done

            echo "=== Nginx reload ==="
            docker exec vitrin-nginx nginx -s reload 2>/dev/null || docker restart vitrin-nginx 2>/dev/null || true

            echo "=== Tüm container durumları ==="
            docker ps --filter name=vitrin --format "table {{.Names}}\t{{.Status}}\t{{.Image}}"

            echo "=== Deploy tamamlandı: $(date) | Commit: ${{ github.sha }} ==="
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # 4. SMOKE TEST
  # ============================================================
  smoke-test:
    name: Smoke Tests (Production)
    runs-on: ubuntu-latest
    needs: deploy
    if: always() && needs.deploy.result != 'cancelled'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.13.0'

      - name: Install dependencies
        working-directory: src/Web/Vitrin.Web.UI
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: src/Web/Vitrin.Web.UI
        run: pnpm exec playwright install chromium --with-deps

      - name: Wait for deployment to stabilize
        run: |
          echo "Deployment stabilize olması bekleniyor (30s)..."
          sleep 30
          for i in {1..10}; do
            if curl -sf --max-time 10 "https://vitrin.it.com" -o /dev/null; then
              echo "Site erişilebilir ✅"
              break
            fi
            echo "Bekleniyor... ($i/10)"
            sleep 10
          done

      - name: Run smoke tests against production
        working-directory: src/Web/Vitrin.Web.UI
        env:
          PLAYWRIGHT_BASE_URL: https://vitrin.it.com
          GATEWAY_URL: https://vitrin.it.com
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: pnpm test:e2e:smoke
        continue-on-error: false

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-report-${{ github.run_number }}
          path: artifacts/playwright-report/
          retention-days: 30

      - name: Upload failure screenshots & videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures-${{ github.run_number }}
          path: artifacts/playwright-results/
          retention-days: 14

      - name: Comment PR with test results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}';
            const emoji = status === 'success' ? '✅' : '❌';
            const runUrl = `https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ${emoji} Smoke Test Sonucu: **${status.toUpperCase()}**\n\n[Playwright Raporunu Görüntüle](${runUrl})\n\n> Deploy sonrası otomatik smoke testler çalıştırıldı.`
            });

  # ============================================================
  # 5. OTOMATİK ROLLBACK
  # Smoke test başarısız olursa bir önceki başarılı commit'e döner
  # Nasıl çalışır: EC2'da önceki image tag'lerini yeniden deploy eder
  # ============================================================
  rollback:
    name: Auto Rollback
    runs-on: ubuntu-latest
    needs: smoke-test
    # Sadece smoke test başarısız olursa ve deploy başarılıysa çalışır
    if: failure() && needs.smoke-test.result == 'failure'

    steps:
      - name: Rollback via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 60s
          command_timeout: 300s
          script: |
            echo "🔴 Smoke test başarısız — rollback başlatılıyor..."
            cd ~/vitrin

            # Deploy adımında kaydedilen önceki image'lara geri dön
            PREV_AUTH=$(cat /tmp/prev_auth_image 2>/dev/null || echo "")
            PREV_WEB=$(cat /tmp/prev_web_image 2>/dev/null || echo "")
            PREV_GATEWAY=$(cat /tmp/prev_gateway_image 2>/dev/null || echo "")

            if [ -n "$PREV_AUTH" ] && [ "$PREV_AUTH" != "unknown" ]; then
              echo "Auth rollback: $PREV_AUTH"
              docker pull "$PREV_AUTH" || true
              docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-deps vitrin-auth
            fi

            if [ -n "$PREV_GATEWAY" ] && [ "$PREV_GATEWAY" != "unknown" ]; then
              echo "Gateway rollback: $PREV_GATEWAY"
              docker pull "$PREV_GATEWAY" || true
              docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-deps vitrin-gateway
            fi

            if [ -n "$PREV_WEB" ] && [ "$PREV_WEB" != "unknown" ]; then
              echo "Web rollback: $PREV_WEB"
              docker pull "$PREV_WEB" || true
              docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-deps vitrin-web
            fi

            docker exec vitrin-nginx nginx -s reload 2>/dev/null || true

            echo "✅ Rollback tamamlandı: $(date)"
            docker ps --filter name=vitrin --format "table {{.Names}}\t{{.Status}}\t{{.Image}}"

      - name: Rollback bildirimini GitHub'a yaz
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'failure',
              description: '🔴 Deploy başarısız — otomatik rollback uygulandı',
              context: 'ci/cd/deploy'
            });


