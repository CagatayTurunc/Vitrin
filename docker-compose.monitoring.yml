version: '3.8'

services:
  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: vitrin-prometheus-new
    ports:
      - "9091:9090"  # Farklı port kullan
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./vitrin-alerting-rules.yml:/etc/prometheus/vitrin-alerting-rules.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'

  # Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: vitrin-grafana-new
    ports:
      - "3005:3000"  # Farklı port kullan
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    volumes:
      - grafana-storage:/var/lib/grafana
      # Provisioning: Dashboard'lar ve datasource otomatik yüklenir
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

  # PostgreSQL Exporter
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter
    ports:
      - "9187:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://username:password@postgres:5432/vitrin?sslmode=disable"
    depends_on:
      - postgres

  # Redis Exporter
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: redis-exporter
    ports:
      - "9121:9121"
    environment:
      REDIS_ADDR: "redis:6379"
    depends_on:
      - redis

  # Alert Manager (Opsiyonel)
  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml

  # Vitrin App (sizin uygulamanız)
  vitrin-app:
    image: vitrin:latest
    container_name: vitrin-app
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=production
    depends_on:
      - postgres
      - redis
    labels:
      - "prometheus.io/scrape=true"
      - "prometheus.io/port=80"
      - "prometheus.io/path=/metrics"

  # PostgreSQL Database
  postgres:
    image: postgres:13
    container_name: postgres
    environment:
      POSTGRES_DB: vitrin
      POSTGRES_USER: vitrin_user
      POSTGRES_PASSWORD: vitrin_pass
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"

volumes:
  grafana-storage:
  postgres-data: