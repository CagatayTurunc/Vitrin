apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-ui
  namespace: vitrin
  labels:
    app.kubernetes.io/name: web-ui
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: vitrin-platform
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: web-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web-ui
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: vitrin-platform
        app.kubernetes.io/version: "1.0.0"
    spec:
      imagePullSecrets:
      - name: container-registry-secret
      containers:
      - name: web-ui
        image: ghcr.io/YOUR_GITHUB_USERNAME/vitrin-web-ui:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: vitrin-web-config
              key: NODE_ENV
        - name: NEXT_PUBLIC_API_URL
          valueFrom:
            configMapKeyRef:
              name: vitrin-web-config
              key: NEXT_PUBLIC_API_URL
        - name: NEXT_PUBLIC_SITE_URL
          valueFrom:
            configMapKeyRef:
              name: vitrin-web-config
              key: NEXT_PUBLIC_SITE_URL
        - name: NEXT_PUBLIC_SITE_NAME
          valueFrom:
            configMapKeyRef:
              name: vitrin-web-config
              key: NEXT_PUBLIC_SITE_NAME
        - name: API_TIMEOUT
          valueFrom:
            configMapKeyRef:
              name: vitrin-web-config
              key: API_TIMEOUT
        - name: FEATURE_ANALYTICS
          valueFrom:
            configMapKeyRef:
              name: vitrin-web-config
              key: FEATURE_ANALYTICS
        - name: FEATURE_REAL_TIME_NOTIFICATIONS
          valueFrom:
            configMapKeyRef:
              name: vitrin-web-config
              key: FEATURE_REAL_TIME_NOTIFICATIONS
        - name: FEATURE_AI_RECOMMENDATIONS
          valueFrom:
            configMapKeyRef:
              name: vitrin-web-config
              key: FEATURE_AI_RECOMMENDATIONS
        - name: CACHE_TTL
          valueFrom:
            configMapKeyRef:
              name: vitrin-web-config
              key: CACHE_TTL
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /api/health
            port: 3000
            scheme: HTTP
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 12
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
      restartPolicy: Always
      terminationGracePeriodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: web-ui-service
  namespace: vitrin
  labels:
    app.kubernetes.io/name: web-ui-service
    app.kubernetes.io/component: frontend-service
    app.kubernetes.io/part-of: vitrin-platform
spec:
  selector:
    app.kubernetes.io/name: web-ui
  ports:
  - name: http
    port: 3000
    targetPort: 3000
    protocol: TCP
  type: ClusterIP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vitrin-web-ingress
  namespace: vitrin
  labels:
    app.kubernetes.io/name: vitrin-web-ingress
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: vitrin-platform
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range"
    # Caching for static assets
    nginx.ingress.kubernetes.io/configuration-snippet: |
      location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary Accept-Encoding;
      }
      location ~* \.(html)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
      }
    # Compression
    nginx.ingress.kubernetes.io/enable-brotli: "true"
    nginx.ingress.kubernetes.io/brotli-level: "6"
    nginx.ingress.kubernetes.io/brotli-types: "text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript"
    # SSL/TLS Configuration (uncomment when domain is ready)
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # nginx.ingress.kubernetes.io/hsts: "true"
    # nginx.ingress.kubernetes.io/hsts-max-age: "31536000"
    # nginx.ingress.kubernetes.io/hsts-include-subdomains: "true"
spec:
  # TLS Configuration (uncomment when domain is ready)
  # tls:
  # - hosts:
  #   - vitrin.com
  #   - www.vitrin.com
  #   secretName: vitrin-web-tls
  rules:
  # Production domain (uncomment when ready)
  # - host: vitrin.com
  #   http:
  #     paths:
  #     - path: /
  #       pathType: Prefix
  #       backend:
  #         service:
  #           name: web-ui-service
  #           port:
  #             number: 3000
  # - host: www.vitrin.com
  #   http:
  #     paths:
  #     - path: /
  #       pathType: Prefix
  #       backend:
  #         service:
  #           name: web-ui-service
  #           port:
  #             number: 3000
  
  # Development/Local access (remove in production)
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web-ui-service
            port:
              number: 3000

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web-ui-hpa
  namespace: vitrin
  labels:
    app.kubernetes.io/name: web-ui-hpa
    app.kubernetes.io/component: autoscaler
    app.kubernetes.io/part-of: vitrin-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web-ui
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web-ui-pdb
  namespace: vitrin
  labels:
    app.kubernetes.io/name: web-ui-pdb
    app.kubernetes.io/component: disruption-budget
    app.kubernetes.io/part-of: vitrin-platform
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: web-ui
  minAvailable: 1

---
# Next.js specific configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: nextjs-config
  namespace: vitrin
  labels:
    app.kubernetes.io/name: nextjs-config
    app.kubernetes.io/component: frontend-config
    app.kubernetes.io/part-of: vitrin-platform
data:
  next.config.js: |
    /** @type {import('next').NextConfig} */
    const nextConfig = {
      output: 'standalone',
      experimental: {
        appDir: true,
      },
      images: {
        domains: ['vitrin.com', 'www.vitrin.com', 'api.vitrin.com'],
        formats: ['image/avif', 'image/webp'],
      },
      compress: true,
      poweredByHeader: false,
      generateEtags: false,
      httpAgentOptions: {
        keepAlive: true,
      },
      onDemandEntries: {
        maxInactiveAge: 25 * 1000,
        pagesBufferLength: 2,
      },
      compiler: {
        removeConsole: process.env.NODE_ENV === 'production',
      },
      headers: async () => {
        return [
          {
            source: '/(.*)',
            headers: [
              {
                key: 'X-Frame-Options',
                value: 'DENY',
              },
              {
                key: 'X-Content-Type-Options',
                value: 'nosniff',
              },
              {
                key: 'Referrer-Policy',
                value: 'strict-origin-when-cross-origin',
              },
              {
                key: 'Permissions-Policy',
                value: 'camera=(), microphone=(), geolocation=()',
              },
            ],
          },
        ];
      },
    };
    
    module.exports = nextConfig;