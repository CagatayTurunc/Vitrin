apiVersion: v1
kind: ServiceAccount
metadata:
  name: vitrin-service-account
  namespace: vitrin
  labels:
    app.kubernetes.io/name: vitrin-service-account
    app.kubernetes.io/component: service-account
    app.kubernetes.io/part-of: vitrin-platform
automountServiceAccountToken: true

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: vitrin
  name: vitrin-role
  labels:
    app.kubernetes.io/name: vitrin-role
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: vitrin-platform
rules:
- apiGroups: [""]
  resources: ["pods", "services", "endpoints", "configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get", "list", "watch"]
# Health check permissions
- apiGroups: [""]
  resources: ["pods/status"]
  verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vitrin-role-binding
  namespace: vitrin
  labels:
    app.kubernetes.io/name: vitrin-role-binding
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: vitrin-platform
subjects:
- kind: ServiceAccount
  name: vitrin-service-account
  namespace: vitrin
roleRef:
  kind: Role
  name: vitrin-role
  apiGroup: rbac.authorization.k8s.io

---
# Service Account for monitoring namespace
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vitrin-monitoring-service-account
  namespace: vitrin-monitoring
  labels:
    app.kubernetes.io/name: vitrin-monitoring-service-account
    app.kubernetes.io/component: monitoring-service-account
    app.kubernetes.io/part-of: vitrin-platform
automountServiceAccountToken: true

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vitrin-monitoring-role
  labels:
    app.kubernetes.io/name: vitrin-monitoring-role
    app.kubernetes.io/component: monitoring-rbac
    app.kubernetes.io/part-of: vitrin-platform
rules:
- apiGroups: [""]
  resources:
  - nodes
  - nodes/proxy
  - services
  - endpoints
  - pods
  - ingresses
  - configmaps
  verbs: ["get", "list", "watch"]
- apiGroups: ["extensions", "networking.k8s.io"]
  resources:
  - ingresses
  verbs: ["get", "list", "watch"]
- nonResourceURLs: ["/metrics"]
  verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vitrin-monitoring-role-binding
  labels:
    app.kubernetes.io/name: vitrin-monitoring-role-binding
    app.kubernetes.io/component: monitoring-rbac
    app.kubernetes.io/part-of: vitrin-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vitrin-monitoring-role
subjects:
- kind: ServiceAccount
  name: vitrin-monitoring-service-account
  namespace: vitrin-monitoring