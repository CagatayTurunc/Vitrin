apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: vitrin
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: vitrin-platform
    app.kubernetes.io/version: "15.4"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: vitrin-platform
    spec:
      containers:
      - name: postgres
        image: postgres:15.4-alpine
        ports:
        - containerPort: 5432
          name: postgresql
        env:
        - name: POSTGRES_DB
          value: vitrin_db
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: vitrin-secrets
              key: postgres-password
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        - name: postgres-init
          mountPath: /docker-entrypoint-initdb.d
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
            - -d
            - vitrin_db
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
            - -d
            - vitrin_db
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 999
          runAsGroup: 999
          fsGroup: 999
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc
      - name: postgres-init
        configMap:
          name: postgres-init-scripts
          defaultMode: 0755
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: vitrin
  labels:
    app.kubernetes.io/name: postgres-service
    app.kubernetes.io/component: database-service
    app.kubernetes.io/part-of: vitrin-platform
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
  - name: postgresql
    port: 5432
    targetPort: 5432
    protocol: TCP
  type: ClusterIP
  clusterIP: None  # Headless service for direct pod access

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
  namespace: vitrin
  labels:
    app.kubernetes.io/name: postgres-init
    app.kubernetes.io/component: database-init
    app.kubernetes.io/part-of: vitrin-platform
data:
  01-init-database.sql: |
    -- Vitrin Database Initialization Script
    
    -- Create extensions
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
    CREATE EXTENSION IF NOT EXISTS "pg_stat_statements";
    
    -- Create application user
    DO $$
    BEGIN
        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'vitrin_app') THEN
            CREATE USER vitrin_app WITH PASSWORD 'vitrin_app_2024';
            GRANT CONNECT ON DATABASE vitrin_db TO vitrin_app;
            GRANT USAGE ON SCHEMA public TO vitrin_app;
            GRANT CREATE ON SCHEMA public TO vitrin_app;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO vitrin_app;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO vitrin_app;
        END IF;
    END
    $$;
    
    -- Performance tuning
    ALTER SYSTEM SET shared_preload_libraries = 'pg_stat_statements';
    ALTER SYSTEM SET max_connections = 200;
    ALTER SYSTEM SET shared_buffers = '256MB';
    ALTER SYSTEM SET effective_cache_size = '1GB';
    ALTER SYSTEM SET maintenance_work_mem = '64MB';
    ALTER SYSTEM SET checkpoint_completion_target = 0.7;
    ALTER SYSTEM SET wal_buffers = '16MB';
    ALTER SYSTEM SET default_statistics_target = 100;
    
    SELECT pg_reload_conf();

---
# PostgreSQL Service Monitor for Prometheus (if using Prometheus Operator)
apiVersion: v1
kind: Service
metadata:
  name: postgres-metrics
  namespace: vitrin
  labels:
    app.kubernetes.io/name: postgres-metrics
    app.kubernetes.io/component: database-metrics
    app.kubernetes.io/part-of: vitrin-platform
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9187"
spec:
  selector:
    app.kubernetes.io/name: postgres-exporter
  ports:
  - name: metrics
    port: 9187
    targetPort: 9187
  type: ClusterIP