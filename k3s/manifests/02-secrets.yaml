apiVersion: v1
kind: Secret
metadata:
  name: vitrin-secrets
  namespace: vitrin
  labels:
    app.kubernetes.io/name: vitrin-secrets
    app.kubernetes.io/component: secrets
    app.kubernetes.io/part-of: vitrin-platform
type: Opaque
data:
  # Database Passwords (Base64 encoded)
  postgres-password: cG9zdGdyZXMxMjM=  # postgres123
  
  # JWT Configuration
  jwt-secret-key: dml0cmluLXN1cGVyLXNlY3JldC1qd3Qta2V5LTIwMjQ=  # vitrin-super-secret-jwt-key-2024
  jwt-issuer: aHR0cHM6Ly9hcGkudml0cmluLmNvbQ==  # https://api.vitrin.com
  jwt-audience: aHR0cHM6Ly92aXRyaW4uY29t  # https://vitrin.com
  
  # External API Keys
  openai-api-key: ""  # OpenAI API key for AI features (base64 encoded)
  sendgrid-api-key: ""  # SendGrid API key for emails (base64 encoded)
  cloudinary-api-key: ""  # Cloudinary for image processing (base64 encoded)
  cloudinary-api-secret: ""  # Cloudinary API secret (base64 encoded)
  
  # Social Login Secrets
  google-client-secret: ""  # Google OAuth client secret (base64 encoded)
  github-client-secret: ""  # GitHub OAuth client secret (base64 encoded)
  microsoft-client-secret: ""  # Microsoft OAuth client secret (base64 encoded)
  
  # Payment Gateway Secrets
  stripe-secret-key: ""  # Stripe secret key (base64 encoded)
  stripe-webhook-secret: ""  # Stripe webhook secret (base64 encoded)
  
  # Monitoring & Analytics
  sentry-dsn: ""  # Sentry DSN for error tracking (base64 encoded)

---
apiVersion: v1
kind: Secret
metadata:
  name: container-registry-secret
  namespace: vitrin
  labels:
    app.kubernetes.io/name: container-registry-secret
    app.kubernetes.io/component: registry-auth
    app.kubernetes.io/part-of: vitrin-platform
type: kubernetes.io/dockerconfigjson
data:
  # GitHub Container Registry authentication
  # Format: {"auths":{"ghcr.io":{"username":"YOUR_USERNAME","password":"YOUR_TOKEN","auth":"BASE64(username:token)"}}}
  # Bu değeri aşağıdaki komutla oluşturun:
  # kubectl create secret docker-registry container-registry-secret \
  #   --docker-server=ghcr.io \
  #   --docker-username=YOUR_GITHUB_USERNAME \
  #   --docker-password=YOUR_GITHUB_TOKEN \
  #   --namespace=vitrin \
  #   --dry-run=client -o yaml
  .dockerconfigjson: eyJhdXRocyI6eyJnaGNyLmlvIjp7InVzZXJuYW1lIjoiWU9VUl9HSVRIVUJfVVNFUk5BTUUiLCJwYXNzd29yZCI6IllPVVJfR0lUSFVCX1RPS0VOIiwiYXV0aCI6IllVOVVVbE5IU1ZSSVZVSmZWVk5GVWs1QlRVVTZXVTlWVWw5SFNWUklWVUpmVkU5TFJVND0ifX19

---
# TLS Secret for Ingress (Let's Encrypt will populate this)
apiVersion: v1
kind: Secret
metadata:
  name: vitrin-tls
  namespace: vitrin
  labels:
    app.kubernetes.io/name: vitrin-tls
    app.kubernetes.io/component: tls-certificate
    app.kubernetes.io/part-of: vitrin-platform
type: kubernetes.io/tls
data:
  # These will be populated by cert-manager
  tls.crt: ""
  tls.key: ""