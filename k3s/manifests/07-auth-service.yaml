apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: vitrin
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/component: microservice
    app.kubernetes.io/part-of: vitrin-platform
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-service
        app.kubernetes.io/component: microservice
        app.kubernetes.io/part-of: vitrin-platform
        app.kubernetes.io/version: "1.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      imagePullSecrets:
      - name: container-registry-secret
      serviceAccountName: vitrin-service-account
      containers:
      - name: auth-service
        image: ghcr.io/YOUR_GITHUB_USERNAME/vitrin-auth:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        - containerPort: 8081
          name: grpc
          protocol: TCP
        env:
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: vitrin-config
              key: ASPNETCORE_ENVIRONMENT
        - name: ASPNETCORE_URLS
          valueFrom:
            configMapKeyRef:
              name: vitrin-config
              key: ASPNETCORE_URLS
        - name: ConnectionStrings__DefaultConnection
          valueFrom:
            configMapKeyRef:
              name: vitrin-config
              key: ConnectionStrings__DefaultConnection
        - name: ConnectionStrings__RedisConnection
          valueFrom:
            configMapKeyRef:
              name: vitrin-config
              key: ConnectionStrings__RedisConnection
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: vitrin-secrets
              key: postgres-password
        - name: JwtSettings__SecretKey
          valueFrom:
            secretKeyRef:
              name: vitrin-secrets
              key: jwt-secret-key
        - name: JwtSettings__Issuer
          valueFrom:
            secretKeyRef:
              name: vitrin-secrets
              key: jwt-issuer
        - name: JwtSettings__Audience
          valueFrom:
            secretKeyRef:
              name: vitrin-secrets
              key: jwt-audience
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: vitrin-config
              key: OTEL_EXPORTER_OTLP_ENDPOINT
        - name: OTEL_SERVICE_NAME
          value: "vitrin-auth-service"
        - name: OTEL_RESOURCE_ATTRIBUTES
          valueFrom:
            configMapKeyRef:
              name: vitrin-config
              key: OTEL_RESOURCE_ATTRIBUTES
        resources:
          requests:
            cpu: 150m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health/startup
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 10
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
      restartPolicy: Always
      terminationGracePeriodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: vitrin
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/component: microservice-service
    app.kubernetes.io/part-of: vitrin-platform
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
spec:
  selector:
    app.kubernetes.io/name: auth-service
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  - name: grpc
    port: 81
    targetPort: 8081
    protocol: TCP
  type: ClusterIP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: auth-service-hpa
  namespace: vitrin
  labels:
    app.kubernetes.io/name: auth-service-hpa
    app.kubernetes.io/component: autoscaler
    app.kubernetes.io/part-of: vitrin-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: auth-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: auth-service-pdb
  namespace: vitrin
  labels:
    app.kubernetes.io/name: auth-service-pdb
    app.kubernetes.io/component: disruption-budget
    app.kubernetes.io/part-of: vitrin-platform
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-service
  minAvailable: 1