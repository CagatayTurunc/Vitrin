# Production override - GHCR imajlarini kullanir, local build yapmaz
# Kullanim: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  vitrin-auth:
    image: ghcr.io/cagatayturunc/vitrin-auth:latest
    build: !reset null

  vitrin-product:
    image: ghcr.io/cagatayturunc/vitrin-product:latest
    build: !reset null

  vitrin-voting:
    image: ghcr.io/cagatayturunc/vitrin-voting:latest
    build: !reset null

  vitrin-comment:
    image: ghcr.io/cagatayturunc/vitrin-comment:latest
    build: !reset null

  vitrin-notification:
    image: ghcr.io/cagatayturunc/vitrin-notification:latest
    build: !reset null

  vitrin-analytics:
    image: ghcr.io/cagatayturunc/vitrin-analytics:latest
    build: !reset null

  vitrin-ai:
    image: ghcr.io/cagatayturunc/vitrin-ai:latest
    build: !reset null

  vitrin-gateway:
    image: ghcr.io/cagatayturunc/vitrin-gateway:latest
    build: !reset null

  vitrin-web:
    image: ghcr.io/cagatayturunc/vitrin-web:latest
    build: !reset null
    # Prod'da port disari acilmaz, nginx uzerinden erisim saglanir
    ports: !reset []
    environment:
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://vitrin.it.com}

  # ============================================================
  # NGINX REVERSE PROXY
  # ============================================================
  nginx:
    image: nginx:alpine
    container_name: vitrin-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # vitrin.conf deploy sirasinda HTTP veya HTTPS olarak guncellenir
      - ./nginx/vitrin.conf:/etc/nginx/conf.d/default.conf
      # SSL sertifikalari (certbot volume'u)
      - certbot_ssl:/etc/letsencrypt:ro
      # Let's Encrypt challenge dosyalari
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - vitrin-web
    networks:
      - vitrin-network

  # ============================================================
  # CERTBOT (SSL otomatik yenileme - 12 saatte bir)
  # ============================================================
  certbot:
    image: certbot/certbot:latest
    container_name: vitrin-certbot
    restart: unless-stopped
    volumes:
      - certbot_ssl:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot --webroot-path=/var/www/certbot --quiet; sleep 12h & wait $${!}; done"

# ============================================================
# VOLUMES
# ============================================================
volumes:
  certbot_ssl:
    name: vitrin_certbot_ssl
  certbot_www:
    name: vitrin_certbot_www
